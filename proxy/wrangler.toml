name = "anko-proxy"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
# 部署好 GitHub Pages 之后，把这里改成你的站点地址，例如：
#   ALLOW_ORIGIN = "https://2308858595.github.io"
# 这样别的网站就没法盗用你的代理。留 "*" 表示不限来源。
ALLOW_ORIGIN = "http://anko.kapp.pp.ua,https://anko.kapp.pp.ua,https://2308858595.github.io,http://localhost:8777"

# 归因用的 app 地址。必须是单个合法 URL——OpenRouter 拿它当 app 的唯一标识，
# 传逗号列表进去会被判成无效，app_id 直接记 null。
APP_URL = "http://anko.kapp.pp.ua"

# 可选：经 AI Gateway 转发（缓存 / 分析 / 额外限流）。key 依然只在本 Worker 里。
# AI_GATEWAY = "https://gateway.ai.cloudflare.com/v1/<account_id>/<gateway_id>"

# 限流：每 IP 每 60 秒 40 次。一回合 2～3 次调用，正常玩够用。
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 40, period = 60 }
