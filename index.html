  num.textContent="?"; shape.classList.remove("land"); shape.classList.add("spin");
  ov.classList.add("on");

  if(!cfg.fast){
    const t0 = performance.now(), dur = o.dur || 1100;
    while(performance.now()-t0 < dur){
      num.textContent = roll(o.faces); tick();
      await sleep(58 + (performance.now()-t0)/22);
    }
  }
  shape.classList.remove("spin"); shape.classList.add("land");
  num.textContent = o.value; chime();

  if(o.winIndex != null){
    const w = optsEl.querySelector('[data-oi="'+o.winIndex+'"]');
    if(w) w.classList.add("win");
  }
  res.innerHTML = o.resultHTML || res.innerHTML;
  res.classList.add("on");
  await sleep(cfg.fast ? 550 : (o.hold || 1400));
  ov.classList.remove("on");
  optsEl.innerHTML = "";
}
/* 哪些判定值得单独走一次掷骰页面：会让剧情分叉的那些 */
/* 默认只有导游标记为大判定（或玩家点了 ★）的才走掷骰页面。
   开了「D10表一律」才把所有分叉表都算进来。 */
const isBigRoll = c => cfg.bigroll!==false
  && (c.big || (cfg.bigTables && (c.kind==="table" || c.kind==="polar")));
/* 按类型分发。任何一种判定都可能被标记成大判定（提示词里 [D100!] 就是合法的），
   所以这里必须覆盖全部 kind——以前除 polar 外一律走 table 分支，
   一个没有选项列表的 [D100!] 就会让 tableRanges 拿到空数组直接崩。 */
function bigRollView(c, note){
  const title = (note ? note+"　" : "") + c.label;
  const sp = c.spec;
  const v = { cap: (sp.n>1?sp.n:1)+"D"+sp.faces + (sp.bonus ? (sp.bonus>0?"+":"")+sp.bonus : ""),
              faces: sp.faces, value: c.raw, title, options: [], winIndex: null };
  const fin = body => (v.resultHTML = '<div class="lbl2">'+esc(title)+'</div>'+body, v);

  if(c.kind==="polar" && c.opts.length>=2){
    const half = Math.floor(sp.faces/2);
    v.options = [{ tag:"1-"+half, text:c.opts[0] },
                 { tag:(half+1)+"-"+sp.faces, text:c.opts[1] }];
    v.winIndex = c.raw <= half ? 0 : 1;
    return fin(esc(c.outcome));
  }
  if(c.kind==="table" && c.opts.length){
    v.options = tableRanges(c).map(r=>({ tag: rangeTag(r), text: r.text }));
    v.options.push({ tag:String(sp.faces), text:"？？？？" });
    v.winIndex = c.special ? v.options.length-1 : tableIndex(c);
    return fin(c.special ? '<span class="k">？？？？</span>　再换一批更离谱的重摇' : esc(c.outcome));
  }
  if(c.kind==="tier" && c.tiers && c.tiers.length){
    const asc = c.tiers.slice().reverse();              // tiers 存的是降序
    v.options = asc.map(t=>({ tag:">"+t.at, text:t.txt }));
    let hit = -1;
    asc.forEach((t,i)=>{ if(c.total > t.at) hit = i; });
    v.winIndex = hit>=0 ? hit : null;
    return fin(esc(c.outcome));
  }
  if(c.kind==="spectrum" && c.poles){
    v.options = [{ tag:"低", text:c.poles[0] }, { tag:"高", text:c.poles[1] }];
    if(c.pct != null) v.winIndex = c.pct < 50 ? 0 : 1;
    return fin(esc(c.outcome));
  }
  // 判定 / 检定 / 好感 / 暗骰 / 骰 / 属性：没有可列举的选项，只报结果
  return fin(esc(c.kind==="hidden" ? "（暗骰，结果不公开）" : c.outcome));
}

/* ============================================================
   骰出 10 → 换一批更离谱的选项重摇，新表的 10 还能继续升级
   ============================================================ */
const ESC_MAX = 3;
function escPrompt(c, prev, depth){
  return [
sysBase(),
``,
`## 现在是【？？？？升级】`,
`判定「${c.label}」骰出了 ${c.spec.faces} —— 也就是「？？？？」。`,
`按安科的规矩，这时不是由你随便写，而是**换一批更离谱的选项重新摇一次**。`,
``,
`${depth>1 ? "上一轮" : "原来"}的选项是：`,
prev.map((o,i)=>(i+1)+". "+o).join("\n"),
``,
`请给出 9 个新选项，要求：`,
`- **明显比上面那批更离谱、更极端、更出格**${depth>1 ? "——这已经是第 "+depth+" 次升级了，尺度要再上一个台阶" : ""}。`,
`- 不要重复上面任何一项，也不要只是给原来的加个形容词了事。`,
`- 九项之间差异要大，覆盖完全不同的方向，别是同一件事的九种说法。`,
`- 每项 10～30 字，是具体的事件或状态，不是抽象描述。`,
`- 仍然贴着本篇的前提走，再离谱也要能圆回故事里。`,
``,
`只输出一行，格式如下，不要有任何其它文字：`,
`《选项一｜选项二｜选项三｜选项四｜选项五｜选项六｜选项七｜选项八｜选项九》`
].join("\n");
}
/* onLevel(newCheck) 用来给每一级升级播掷骰动画 */
async function escalateTable(c, signal, onLevel){
  c.chain = [];
  let prev = c.opts, depth = 0;
  while(depth < ESC_MAX){
    depth++;
    let r;
    try{
      r = await streamChat([{role:"system",content:"x"},{role:"user",content:"给出升级后的选项。"}],
                           ()=>{}, signal, escPrompt(c, prev, depth));
    }catch(e){ if(fatalErr(e)) throw e; break; }
    bill(r.usage);
    const inner = grabAngle(r.text);
    if(!inner) break;
    const opts = splitOpts(inner);
    if(opts.length < 2) break;

    const nc = { kind:"table", label:c.label, mods:[], opts, diff:null, big:c.big,
                 spec:{ n:1, faces:c.spec.faces, bonus:0 }, escLevel:depth };
    resolveCheck(nc);
    c.chain.push(nc);
    if(onLevel) await onLevel(nc);
    if(!nc.special) break;            // 没再骰出 10 就停
    prev = opts;
  }
  const last = c.chain.length ? c.chain[c.chain.length-1] : null;
  if(last && !last.special) c.outcome = last.outcome;
  else if(last) c.outcome = "？？？？（升级到顶，交由主持人自由发挥）";
  return c;
}

/* 交锋逐回合揭示——不能默默算完就宣布谁赢，要让读者看着点数一回合一回合出来 */
async function revealDuel(d, box, before){
  if(!d || !d.res || !box) return;
  const wrap = document.createElement("div");
  wrap.className = "duel pop";
  wrap.innerHTML = '<div class="dh"><span class="k">言论交锋</span>'+esc(d.topic||"")+'</div>'
    + '<div class="bar" id="dl-bar"></div><div id="dl-rows"></div>';
  box.insertBefore(wrap, before || null);
  const bar = wrap.querySelector("#dl-bar"), rows = wrap.querySelector("#dl-rows");
  const paintBar = pos => {
    let h = '<span class="nm">'+esc(d.us.name)+'</span>';
    for(let i=-3;i<=3;i++){
      if(i===0){ h += '<span class="c" style="flex:0 0 2px;background:var(--line2)"></span>'; continue; }
      const on = (i>0 && pos>=i) || (i<0 && pos<=i);
      h += '<span class="c '+(on ? (i>0?"us":"them") : "")+'"></span>';
    }
    bar.innerHTML = h + '<span class="nm">'+esc(d.them.name)+'</span>';
  };
  paintBar(0);
  for(const x of d.res.log){
    const aw = x.w==="us", bw = x.w==="them";
    const row = document.createElement("div");
    row.className = "rd pop";
    row.innerHTML = '<span class="n">第'+x.r+'回</span>'
      + '<span class="s'+(aw?" w":"")+'">'+esc(d.us.name)+' '+x.a.ds.join("+")+' = '+x.a.sum+'</span>'
      + '<span class="s'+(bw?" w":"")+'">'+esc(d.them.name)+' '+x.b.ds.join("+")+' = '+x.b.sum+'</span>'
      + '<span class="adv">优势 '+(x.adv>0?"+":"")+x.adv+'</span>';
    rows.appendChild(row);
    paintBar(x.adv);
    clack();
    await sleep(cfg.fast ? 60 : 520);
  }
  const wn = d.res.winner==="us" ? d.us.name : d.res.winner==="them" ? d.them.name : null;
  const win = document.createElement("div");
  win.className = "win pop";
  win.textContent = wn ? wn+" 取得了胜利" : "势均力敌，不分胜负";
  wrap.appendChild(win);
  chime();
  await sleep(cfg.fast ? 200 : 800);
}

/* 好感度与线索从各回合重算——重写回合后能干净地回滚，不会留下已撤销回合的账 */
function rebuildLedger(){
  game.aff = {}; game.clues = [];
  storyTurns().forEach(t=>{
    (t.checks||[]).filter(c=>c.kind==="aff").forEach(c=>{
      const m = c.label.match(/^(.+?)\s*(?:对|→|->)\s*(.+)$/);
      if(m){ const k = cleanName(m[1])+" → "+cleanName(m[2]); game.aff[k] = (game.aff[k]||0) + c.lv; }
    });
    (t.affs||[]).forEach(a=>{ const k=cleanName(a.a)+" → "+cleanName(a.b); game.aff[k] = (game.aff[k]||0) + a.v; });
    (t.clues||[]).forEach(c=> game.clues.push({ turn:t.no, text:c }));
  });
}

/* 作弊：重写最后一回。不打断正常流程，事后不满意才用。
   mode 'write'   —— 判定不变，只让导游重写一遍
   mode 'recheck' —— 重掷本回合的判定，再重写
   mode 'roll'    —— 改上一回的 1D10 点数，整回重来（含重新申请判定） */
async function redoTurn(mode){
  if(overCap()) return dockBudget();
  if(busy) return;
  const ts = storyTurns();
  const cur = ts[ts.length-1];
  if(!cur) return;

  game.turns.splice(game.turns.indexOf(cur), 1);
  rebuildLedger();

  let preset = null;
  if(mode === "write") preset = { checks: cur.checks, duel: cur.duel };
  else if(mode === "recheck"){
    (cur.checks||[]).forEach(c=>{
      ["crit","fumble","special","lv","parts","raw","total","outcome"].forEach(k=>delete c[k]);
      resolveCheck(c);
    });
    if(cur.duel) cur.duel.res = simDuel(cur.duel.us, cur.duel.them);
    preset = { checks: cur.checks, duel: cur.duel };
  }
  render(); saveGame();
  await nextTurn(preset);
}

/* 意外事件池：每回合问一次骰娘 */
function rollIncident(){
  const pool = (cfg.pool||"").split("\n").map(x=>x.trim()).filter(x=>x.length>1);
  if(!pool.length) return null;
  const gate = roll(100);
  if(gate < 85) return null;
  return { gate, pick: pool[roll(pool.length)-1], size: pool.length };
}

/* preset：重写本回合时把已经摇好的判定原样带回来，跳过判定阶段 */
async function nextTurn(preset){
  if(busy) return;
  if(overCap()) return dockBudget();
  busy = true; ctrl = new AbortController();
  const no = storyTurns().length + 1;

  try{
    let checks = [], duel = null, extra = null, incident = null;

    /* ---- 自动压缩前情（攒够了才跑，一般十来回一次） ---- */
    try{
      await autocompact(ctrl.signal, () => {
        dock('<div class="dockmsg">前面的剧情有点长了，正在压成一份前情提要…</div>'
          + '<button class="btn" style="width:100%;margin-top:8px" id="btn-stopc">停止</button>');
        $("#btn-stopc").onclick = ()=>ctrl.abort();
      });
    }catch(e){
      if(fatalErr(e)) throw e;
      // 压缩失败不该连累这一回：这次就用完整历史往下写，下一回再试
      try{ console.warn("[安科] 前情压缩失败，本回合用完整历史：", e); }catch(_){}
      toast("前情压缩失败，这回先用完整历史");
    }

    /* ---- 开局骰（仅第 1 回之前） ---- */
    if(cfg.chargen && !game.sheet && no === 1){
      dock('<div class="dockmsg">开局骰：正在生成世界与人物卡…</div>'
        + '<button class="btn" style="width:100%;margin-top:8px" id="btn-stop0">停止</button>');
      $("#btn-stop0").onclick = ()=>ctrl.abort();
      live('<div class="turn"><div class="tno"><span class="n">开局骰</span></div>'
        + '<div class="load"><span class="dots"><i></i><i></i><i></i></span>导游正在决定这个世界和主角是什么样子…</div></div>');

      const cg = await streamChat([{role:"system",content:"x"},{role:"user",content:"开始开局骰。"}],
        ()=>{}, ctrl.signal, chargenPrompt());
      bill(cg.usage);
      const parsed = parseChargen(cg.text);
      const all = parsed.world.concat(parsed.person);
      if(all.length < 4) throw new Error("开局骰解析失败，只认出 "+all.length+" 条。\n\n原始输出：\n"+cg.text.slice(0,500));

      /* 逐条追加，不重建已显示的，避免整块闪烁 */
      live('<div class="turn"><div class="tno"><span class="n">开局骰</span></div>'
        + '<div class="narr" id="cgbox"><div class="load" id="cgload">'
        + '<span class="dots"><i></i><i></i><i></i></span>摇骰中…</div></div></div>');
      const cgbox = $("#cgbox"), cgload = $("#cgload");
      for(const c of all){
        resolveCheck(c);
        if(isBigRoll(c)) await diceShow(bigRollView(c));
        else { clack(); if(c.crit||c.fumble) chime(); }
        if(c.kind==="table" && c.special)
          await escalateTable(c, ctrl.signal, async nc=>{
            if(isBigRoll(c)) await diceShow(bigRollView(nc, "更离谱的一批"));
            else clack();
          });
        if(cgbox){
          const tmp = document.createElement("div");
          tmp.innerHTML = checkHTML(c, null);
          const el = tmp.firstElementChild;
          if(el){ el.classList.add("pop"); cgbox.insertBefore(el, cgload); }
        }
        await sleep(cfg.fast ? 40 : 260);
      }
      if(cgload) cgload.remove();
      liveLast = null;
      game.sheet = sheetFrom(parsed.world, parsed.person);
      game.turns.push({ no:0, chargen:true, scene:[], narration:"", checks:all, options:[],
                        stats:[], clues:[], affs:[], raw:"", rolled:null, chaos:null, manual:null });
      live(""); render(); saveGame();
    }

    /* ---- 重写本回合：判定已经摇好，直接进书写阶段 ---- */
    if(preset){
      checks = preset.checks || []; duel = preset.duel || null; incident = preset.incident || null;
      if(checks.length || duel || incident) extra = checksToPrompt(checks, duel, incident);
      for(const c of checks) if(isBigRoll(c)) await diceShow(bigRollView(c));
      live('<div class="turn"><div class="tno"><span class="n">第 '+no+' 回</span></div>'
        + '<div class="narr">'+checks.map((x,i)=>checkHTML(x,i)).join("")+'</div></div>');
    }
    /* ---- 判定阶段 ---- */
    else if(cfg.plan){
      dock('<div class="dockmsg">主持人正在申请第 '+no+' 回的判定…</div>'
        + '<button class="btn" style="width:100%;margin-top:8px" id="btn-stop">停止</button>');
      $("#btn-stop").onclick = ()=>ctrl.abort();
      live('<div class="turn"><div class="tno"><span class="n">第 '+no+' 回</span></div>'
        + '<div class="load"><span class="dots"><i></i><i></i><i></i></span>判定阶段：主持人正在声明这一回要交给骰子的事…</div></div>');

      /* 关键：历史里最后一条 user 是「请演绎出来，写第 N 回」，会和判定阶段的
         system 指令打架。回合一多，模型就照着写正文去了、判定全空。
         所以这里必须补一条最后的 user 指令把它压回来。 */
      const KICK = "【判定阶段】停。现在**不要写正文**，也不要接着上面的剧情往下写。\n"
        + "这一次只输出第 " + no + " 回需要交给骰子的判定申请（每行一条，[类型] 开头）。";
      let plan = await streamChat(buildMsgs(KICK), ()=>{}, ctrl.signal, planPrompt());
      bill(plan.usage);
      checks = parseChecks(plan.text.replace(/[=＝]{2,}\s*交\s*锋[\s\S]*$/,""));

      // 一条都没解析出来 = 模型跑偏了，再逼一次，别静默地把这一回的骰子全跳过
      if(!checks.length){
        try{ console.warn("[安科] 第"+no+"回判定申请为空，重试。原始输出：", plan.text.slice(0,300)); }catch(e){}
        const RETRY = KICK + "\n\n上一次你没有按格式输出。请**只**输出 3～5 行，"
          + "每行形如：\n[D100] 事项 (+20 理由)\n[D10表] 事项 《甲｜乙｜丙》\n"
          + "不要有任何其它文字，不要写正文。";
        plan = await streamChat(buildMsgs(RETRY), ()=>{}, ctrl.signal, planPrompt());
        bill(plan.usage);
        checks = parseChecks(plan.text.replace(/[=＝]{2,}\s*交\s*锋[\s\S]*$/,""));
        if(!checks.length) toast("这一回没能生成判定，直接进入书写");
      }
      if(cfg.duel) duel = parseDuel(plan.text);

      /* 摇骰，逐条揭示——往容器里追加，不重建已经显示过的，避免闪烁 */
      if(checks.length || duel){
        live('<div class="turn"><div class="tno"><span class="n">第 '+no+' 回</span></div>'
          + '<div class="narr" id="chkbox"><div class="load" id="chkload">'
          + '<span class="dots"><i></i><i></i><i></i></span>判定中…</div></div></div>');
        const box = $("#chkbox"), ld = $("#chkload");
        for(const c of checks){
          resolveCheck(c);
          if(isBigRoll(c)) await diceShow(bigRollView(c));
          else { clack(); if(c.crit||c.fumble) chime(); }
          if(c.kind==="table" && c.special)
            await escalateTable(c, ctrl.signal, async nc=>{
              if(isBigRoll(c)) await diceShow(bigRollView(nc, "更离谱的一批"));
              else clack();
            });
          if(box){
            const tmp = document.createElement("div");
            tmp.innerHTML = checkHTML(c, null);
            const el = tmp.firstElementChild;
            if(el){ el.classList.add("pop"); box.insertBefore(el, ld); }
          }
          await sleep(cfg.fast ? 40 : 320);
        }
        if(duel){
          duel.res = simDuel(duel.us, duel.them);
          await revealDuel(duel, box, ld);
        }
        if(ld) ld.remove();
        liveLast = null;   // 下一阶段要重新接管这块
      }
      incident = rollIncident();
      if(checks.length || duel || incident) extra = checksToPrompt(checks, duel, incident);
    }

    /* ---- 书写阶段 ---- */
    dock('<div class="dockmsg">主持人正在写第 '+no+' 回…</div>'
      + '<button class="btn" style="width:100%;margin-top:8px" id="btn-stop2">停止生成</button>');
    $("#btn-stop2").onclick = ()=>ctrl.abort();

    /* 书写阶段：外壳只搭一次，之后只改正文那一块。
       整卡重建会把已经显示的判定块反复销毁重建，那正是流式过程中的闪烁来源。 */
    live('<div class="turn"><div class="tno"><span class="n">第 '+no+' 回</span></div>'
      + '<div class="scene" id="lv-scene" style="display:none"></div>'
      + '<div class="narr">'
      +   '<div id="lv-chk">'+checks.map((x,i)=>checkHTML(x,i)).join("")+'</div>'
      +   '<div id="lv-narr"></div>'
      + '</div><div id="lv-opts"></div></div>');
    const lvScene=$("#lv-scene"), lvNarr=$("#lv-narr"), lvOpts=$("#lv-opts"), lvChk=$("#lv-chk");
    let lastO="", lastS="", lastChk=null, tick0=0;
    let painted = [];   // 已经画进 #lv-narr 的块

    /* 按块增量刷新：只重画从第一个变化的块开始的部分。
       流式文本只会往后长，所以通常只有最后一块在动——
       已经归位的判定块和段落不会被销毁重建，因此不闪。 */
    const paintNarr = p => {
      const s = narrScan({ narration:p.narration||"", checks, duel }, false);
      // 还没被正文标记认领的判定，暂时留在上方容器里；认领一个就少一个
      const leftHTML = checks.map((c,i)=>s.used.has(i)?null:checkHTML(c,i)).filter(Boolean).join("");
      if(lvChk && leftHTML !== lastChk){ lvChk.innerHTML = leftHTML; lastChk = leftHTML; }

      let i = 0;
      while(i < painted.length && i < s.blocks.length && painted[i] === s.blocks[i]) i++;
      while(lvNarr.children.length > i) lvNarr.removeChild(lvNarr.lastChild);
      for(let k=i; k<s.blocks.length; k++){
        const tmp = document.createElement("div");
        tmp.innerHTML = s.blocks[k];
        const el = tmp.firstElementChild;
        if(el){ if(el.classList.contains("chk")||el.classList.contains("duel")) el.classList.add("pop");
                lvNarr.appendChild(el); }
      }
      painted = s.blocks;
    };

    const { text, usage } = await streamChat(buildMsgs(extra), tx=>{
      const now = performance.now();
      if(now - tick0 < 90) return;                 // 节流，别每个 chunk 都重排
      tick0 = now;
      const p = parseTurn(tx);
      if(!p.narration && !p.options.length) return;
      if(lvNarr) paintNarr(p);
      const sh = (p.scene||[]).map(x=>"<div>"+esc(x)+"</div>").join("");
      if(lvScene && sh!==lastS){ lvScene.innerHTML = sh; lvScene.style.display = sh?"":"none"; lastS = sh; }
      const oh = p.options.length
        ? '<div class="opts"><div class="hd">10 个走向</div>'
          + p.options.map((o,i)=> o ? '<div class="opt'+(isQ(o)?" q":"")+'"><span class="i">'+(i+1)
              + '</span><span class="t">'+esc(o)+'</span></div>' : "").join("") + '</div>'
        : "";
      if(lvOpts && oh!==lastO){ lvOpts.innerHTML = oh; lastO = oh; }
    }, ctrl.signal);
    bill(usage);

    const p = parseTurn(text);
    if(!p.narration) throw new Error("解析失败：找不到正文。\n\n原始输出片段：\n"+text.slice(0,400));

    /* 选项单独再要一次：正文末尾顺手写出来的选项容易和往回合雷同 */
    if(cfg.sepopts){
      const askOpts = async (extraHint, slim) => {
        const oz = await streamChat(
          [{role:"system",content:"x"},{role:"user",content:"给出这一回的 10 个走向。"+(extraHint||"")}],
          tx=>{
            const got = parseOpts(tx).filter(Boolean);
            if(lvOpts && got.length) lvOpts.innerHTML = '<div class="opts"><div class="hd">10 个走向</div>'
              + got.map((o,i)=>'<div class="opt'+(isQ(o)?" q":"")+'"><span class="i">'+(i+1)
                + '</span><span class="t">'+esc(o)+'</span></div>').join("") + '</div>';
          }, ctrl.signal, optsPrompt(p.narration, p.stats, slim));
        bill(oz.usage);
        return { list: parseOpts(oz.text), raw: oz.text };
      };
      dock('<div class="dockmsg">正在推敲这一回的 10 个走向…</div>');
      let got = null, lastRaw = "", lastErr = null;
      for(let attempt = 0; attempt < 2; attempt++){
        if(attempt) dock('<div class="dockmsg">走向没出全，再要一次…</div>');
        try{
          const r = await askOpts(attempt
            ? "\n\n上一次没有按格式输出。请**只**输出 10 行，形如「1. xxx」，第 10 行固定为「10. ？？？？」，不要有其它任何文字。"
            : "", attempt > 0);
          lastRaw = r.raw;
          if(r.list.filter(Boolean).length >= 4){ got = r.list; break; }
        }catch(e){
          if(fatalErr(e)) throw e;   // 停止 / 到上限：别重试，直接抛出去
          lastErr = e;
        }
      }
      if(got) p.options = got;
      else if(!p.options.filter(Boolean).length)
        // 报错要指向真正失败的那一步，别再把「正文」调用的输出贴出来误导人
        throw new Error("走向生成失败（正文已写好，是这一步没出全 10 个走向）。\n\n"
          + (lastErr ? "错误：" + lastErr.message + "\n\n" : "")
          + "走向调用的原始输出：\n" + (lastRaw ? lastRaw.slice(0,400) : "（空）"));
    }

    if(p.options.filter(Boolean).length < 4)
      throw new Error("解析失败：只解析出 "+p.options.filter(Boolean).length+" 个选项。\n\n正文调用的原始输出：\n"+text.slice(0,400));
    for(let i=0;i<10;i++) if(!p.options[i]) p.options[i] = i===9 ? "？？？？" : "（主持人自由发挥）";
    if(!isQ(p.options[9])) p.options[9] = "？？？？";

    const turn = { no, scene:p.scene, narration:p.narration, stats:p.stats, clues:p.clues, affs:p.affs,
                   options:p.options, checks, duel, raw:text, rolled:null, chaos:null, manual:null };
    game.turns.push(turn);

    rebuildLedger();
    live(""); render(); dockRoll(); saveGame();
  }catch(e){
    live("");
    // 到上限了就别摆「重试」按钮——按下去只会再被拦一次
    if(e.name === "BudgetError"){ render(); dockBudget(); return; }
    const aborted = e.name === "AbortError";
    dock('<div class="err"><b>'+(aborted?"已停止":"出错了")+'</b>'
      + (aborted ? "" : '<div class="m">'+esc(e.message)+'</div>')
      + '<div class="btns"><button class="btn primary sm" id="e-retry">重试</button>'
      + '<button class="btn sm" id="e-set">打开设置</button></div></div>');
    $("#e-retry").onclick = ()=>nextTurn();
    $("#e-set").onclick = openSettings;
  }finally{
    busy = false; ctrl = null;
  }
}

/* ============================================================
   主骰
   ============================================================ */
async function doRoll(forced){
  if(busy) return;
  const t = lastTurn();
  if(!t || t.rolled || t.manual) return;
  busy = true;

  // 默认一切听骰子的；只有开了作弊模式才接受指定点数
  const val = (cfg.cheat && forced>=1 && forced<=10) ? forced : roll(10);
  t.forced = !!(cfg.cheat && forced);
  const chaosOpt = isQ(t.options[val-1]);
  const ov=$("#dice"), num=$("#d-num"), shape=$("#d-shape"), res=$("#d-res"), cap=$("#d-cap");
  cap.textContent="1D10"; res.textContent=""; res.classList.remove("on");
  num.textContent="?"; shape.classList.remove("land"); shape.classList.add("spin"); ov.classList.add("on");

  let t0 = performance.now();
  if(!cfg.fast) while(performance.now()-t0 < 1150){ num.textContent = roll(10); tick(); await sleep(58+(performance.now()-t0)/22); }
  shape.classList.remove("spin"); shape.classList.add("land");
  num.textContent = val; chime();
  t.rolled = val;

  if(chaosOpt){
    res.innerHTML = '<span class="k">？？？？</span>　交由主持人自由发挥';
    res.classList.add("on"); await sleep(cfg.fast?400:1000);
    const cv = roll(2), label = cv===1 ? "大成功" : "大失败";
    cap.textContent="1D2 · 大成功 / 大失败"; res.classList.remove("on"); await sleep(cfg.fast?80:220);
    num.textContent="?"; shape.classList.remove("land"); shape.classList.add("spin");
    t0 = performance.now();
    if(!cfg.fast) while(performance.now()-t0 < 850){ num.textContent = roll(2); tick(); await sleep(62+(performance.now()-t0)/16); }
    shape.classList.remove("spin"); shape.classList.add("land");
    num.textContent = cv; chime();
    t.chaos = { v:cv, label };
    res.innerHTML = '<span class="'+(cv===1?"g":"r")+'">'+label+'</span>';
    res.classList.add("on"); await sleep(cfg.fast?600:1150);
  } else {
    res.innerHTML = val+'　<span style="color:var(--tx2)">'+esc(t.options[val-1])+'</span>';
    res.classList.add("on"); await sleep(cfg.fast?600:1250);
  }
  ov.classList.remove("on");
  render(); saveGame(); busy=false; nextTurn();
}
function pickOption(i){
  const t = lastTurn();
  if(!t || t.rolled || t.manual || busy) return;
  // ？？？？ 只能靠骰子交出来——除非开了作弊模式
  if(isQ(t.options[i-1])){ if(cfg.cheat) doRoll(i); return; }
  t.manual = t.options[i-1]; render(); saveGame(); nextTurn();
}
function doAnka(){
  const el=$("#anka-in"); if(!el) return;
  const v = el.value.trim(); if(!v) return;
  const t = lastTurn();
  if(!t || t.rolled || t.manual || busy) return;
  t.manual = v; render(); saveGame(); nextTurn();
}
$("#feed").addEventListener("click", e=>{
  const b = e.target.closest("[data-pick]"); if(b) return pickOption(+b.dataset.pick);

  const t = lastTurn();
  const reflow = () => { render(); if(!busy){ const x=lastTurn(); if(x && !x.rolled && !x.manual) dockRoll(); } };

  // ★ 标记大判定：重写本回合时会弹掷骰页面
  const bg = e.target.closest("[data-ck-big]");
  if(bg && t && t.checks){
    const c = t.checks[+bg.dataset.ckBig]; if(!c) return;
    c.big = !c.big; saveGame(); reflow();
    return toast(c.big ? "已标记为大判定，重写本回合时会掷骰" : "已取消大判定标记");
  }
  // ↻ 重掷某一项判定
  const rr = e.target.closest("[data-ck-rr]");
  if(rr && t && t.checks){
    const c = t.checks[+rr.dataset.ckRr]; if(!c) return;
    ["crit","fumble","special","lv","parts","raw","total","outcome"].forEach(k=>delete c[k]);
    resolveCheck(c); clack(); saveGame(); reflow();
    return;
  }
  // ✓ 用填进去的点数
  const st = e.target.closest("[data-ck-set]");
  if(st && t && t.checks){
    const i = +st.dataset.ckSet, c = t.checks[i]; if(!c) return;
    const inp = document.querySelector('[data-ck-in="'+i+'"]');
    const v = inp ? parseInt(inp.value,10) : NaN;
    if(!(v>=1 && v<=c.spec.faces)) return toast("填 1 到 "+c.spec.faces);
    ["crit","fumble","special","lv","parts","raw","total","outcome"].forEach(k=>delete c[k]);
    resolveCheck(c, v); c.forcedRaw = true; clack(); saveGame(); reflow();
    return;
  }
  const d = e.target.closest("[data-redo]");
  if(d){
    if(busy) return toast("正在生成，稍等一下");
    redoTurn(d.dataset.redo);
  }
});

   台账 / 导出
   ============================================================ */
function openLedger(){
  const A = Object.entries(game.aff).sort((a,b)=>b[1]-a[1]);
  let h = game.sheet ? sheetHTML(game.sheet).replace('class="card"','class="card" style="margin:0 0 18px"') : "";
  h += '<div class="note">好感度按帖子里的换算表结算：1~15→-3、16~30→-2、31~45→-1、46~55→0、56~70→+1、71~85→+2、86~100→+3。</div>';
  h += '<div class="ledger">' + (A.length
    ? A.map(([k,v])=>'<div class="r"><span>'+esc(k)+'</span><span style="color:'
        +(v>0?"var(--green)":v<0?"var(--red)":"var(--tx3)")+'">'+(v>0?"+":"")+v+'</span></div>').join("")
    : '<div style="color:var(--tx3)">还没有结算过好感度。</div>') + '</div>';
  h += '<h3 style="margin:20px 0 10px;font-size:14px;color:var(--cyan)">线索（'+game.clues.length+'）</h3>';
  h += game.clues.length
    ? game.clues.map(c=>'<div class="clue"><span class="h">[ 第 '+c.turn+' 回 ]</span>'+esc(c.text)+'</div>').join("")
    : '<div style="color:var(--tx3);font-size:13px">还没有收集到线索。</div>';
  /* 前 N 回已经不在 prompt 里了，模型只剩这段记忆——摊开来给人看，
     万一提要漏了要紧的东西，还能自己在安价里补一句。 */
  if(game.digest){
    h += '<h3 style="margin:20px 0 10px;font-size:14px;color:var(--gold)">前情提要（第 1～'
       + game.digest.upto + ' 回）</h3>';
    h += '<div class="note" style="white-space:pre-wrap;line-height:1.8">' + esc(game.digest.text)
       + '</div><div style="color:var(--tx3);font-size:12px;margin-top:8px">'
       + '这 ' + game.digest.upto + ' 回的正文已经不再发给模型了（原文 '
       + (game.digest.chars||0) + ' 字 → 提要 ' + game.digest.text.length
       + ' 字），它对早期剧情的记忆就是上面这一段。页面上的正文和导出不受影响。</div>';
  }
  $("#led-body").innerHTML = h;
  $("#m-led").classList.add("on");
}
function exportMD(){
  const L = ["# "+(cfg.title||"未命名安科"), "", "> "+cfg.premise.replace(/\n/g,"\n> "), "",
    "*模型："+cfg.model+"　混沌度："+cfg.chaos+"/5　共 "+storyTurns().length+" 回*", "", "---", ""];
  if(game.sheet){
    L.push("## 开局骰","");
    game.sheet.world.forEach(w=>L.push("- "+w.label+"："+w.outcome));
    const a = Object.entries(game.sheet.attrs);
    if(a.length) L.push("", "**属性**　"+a.map(([k,v])=>"`"+k+" "+v+"`").join("　"));
    game.sheet.traits.forEach(t=>L.push("- "+t.label+"："+t.outcome));
    L.push("","---","");
  }
  storyTurns().forEach(t=>{
    L.push("## 第 "+t.no+" 回", "");
    if(t.scene && t.scene.length) L.push(t.scene.map(x=>"`["+x+"]`").join(" "), "");
    (t.checks||[]).forEach((c,i)=>{
      const kind = {d100:"判定",polar:"极性",table:"D10表",aff:"好感",hidden:"暗骰"}[c.kind];
      L.push("`["+kind+"] "+c.label+" "+checkExpr(c)+" → "+c.outcome+"`");
    });
    if((t.checks||[]).length) L.push("");
    L.push(t.narration.replace(/^[【\[]\s*(判定\s*\d+|交锋)\s*[】\]]$/gm,"").replace(/\n{3,}/g,"\n\n"), "");
    if(t.duel && t.duel.res){
      L.push("**言论交锋 · "+t.duel.topic+"**", "");
      t.duel.res.log.forEach(x=>L.push("- 第"+x.r+"回合　"+t.duel.us.name+" "+x.a.sum+" vs "
        +t.duel.them.name+" "+x.b.sum+"　→ 优势 "+(x.adv>0?"+":"")+x.adv));
      L.push("");
    }
    if(t.stats && t.stats.length) L.push(t.stats.map(s=>"`"+s.k+"："+s.v+"`").join("　"), "");
    (t.clues||[]).forEach(c=>L.push("> [线索已收集] "+c, ""));
    (t.options||[]).forEach((o,i)=>{ if(o) L.push((i+1)+". "+o+(t.rolled===i+1?"　**← 选中**":"")); });
    L.push("");
    if(t.rolled){
      L.push("`【ROLL：1D10=d10(10)="+t.rolled+"】`"+(t.chaos?"":" → "+(t.options[t.rolled-1]||"")));
      if(t.chaos) L.push("`【ROLL：1D2=d2(2)="+t.chaos.v+"】` → **"+t.chaos.label+"**");
      L.push("");
    } else if(t.manual) L.push("`【安价】` "+t.manual, "");
    L.push("---","");
  });
  const A = Object.entries(game.aff);
  if(A.length){ L.push("## 好感度结算",""); A.forEach(([k,v])=>L.push("- "+k+"　"+(v>0?"+":"")+v)); L.push(""); }
  const blob = new Blob([L.join("\n")], {type:"text/markdown;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (cfg.title||"安科").replace(/[\\/:*?"<>|]/g,"_")+".md";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("已导出 Markdown");
}

$("#f-temp").oninput  = e=>$("#lb-temp").textContent=(+e.target.value).toFixed(2);
$("#f-mem").oninput   = e=>$("#lb-mem").textContent=e.target.value;
$$("#f-len button").forEach(b=>b.onclick=()=>{ $$("#f-len button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); });

$("#btn-start").onclick = () => {
  const premise = $("#f-premise").value.trim();
  if(!premise){ toast("先写一句前提设定吧"); $("#f-premise").focus(); return; }
  const key = $("#f-key").value.trim();
  if(!key && !hasProxy()){ toast("需要一个 OpenRouter API Key"); $("#f-key").focus(); return; }
  Object.assign(cfg, { key, premise, sid: rid(4),
    model: $("#f-model").value.trim() || "~google/gemini-flash-latest",
    title: $("#f-title").value.trim() || premise.split(/[。\n，]/)[0].slice(0,20),
    chaos:+$("#f-chaos").value, temp:+$("#f-temp").value, mem:+$("#f-mem").value,
    autocompact:$("#f-autocompact").checked,
    chargen:$("#f-chargen").checked, cheat:$("#f-cheat").checked, bigroll:$("#f-bigroll").checked, bigTables:$("#f-bigtables").checked, fast:$("#f-fast").checked, sepopts:$("#f-sepopts").checked, thrift:$("#f-thrift").checked, pool:$("#f-pool").value,
    plan:$("#f-plan").checked, duel:$("#f-duel").checked, anka:$("#f-anka").checked,
    status:$("#f-status").checked, sound:$("#f-sound").checked,
    len: ($("#f-len button.on")||{dataset:{v:"mid"}}).dataset.v });
  saveCfg();
  game = { turns:[], aff:{}, clues:[], cost:0, tok:0, sheet:null, digest:null };
  enterGame(); nextTurn();
};
function enterGame(){ $("#setup").style.display="none"; $("#game").style.display="flex";
  render(); paintFast(); window.scrollTo(0,0); }

function offerResume(){
  const g = loadGame(); if(!g) return;
  const story = g.turns.filter(t=>!t.chargen);
  const last = story[story.length-1];
  $("#resume-wrap").innerHTML =
    '<div class="panel" style="margin-top:16px;padding:18px">'
    + '<div style="font-size:13px;color:var(--tx2);margin-bottom:12px">找到存档：<b style="color:var(--pink2)">'
    + esc(cfg.title||"未命名安科")+'</b> · 已进行 '+story.length+' 回'
    + (last && !last.rolled && !last.manual ? "（等待掷骰）" : "")+'</div>'
    + '<button class="btn" style="width:100%" id="btn-resume">继续上次的安科</button></div>';
  $("#btn-resume").onclick = () => {
    game = Object.assign({ turns:[], aff:{}, clues:[], cost:0, tok:0, sheet:null, digest:null }, g);
    enterGame();
    const t = lastTurn();
    if(t && !t.rolled && !t.manual) dockRoll(); else nextTurn();
  };
}
async function loadModels(){
  try{
    const d = (await (await fetch(API+"/models")).json()).data || [];
    const u = d.filter(m=>!/:batch$/.test(m.id) && !/-image|image-|tts|whisper|embed/.test(m.id))
                .sort((a,b)=>a.id.localeCompare(b.id));
    $("#modellist").innerHTML = u.map(m=>'<option value="'+esc(m.id)+'">'+esc(m.name)+' — $'
      +(+m.pricing.prompt*1e6).toFixed(2)+'/$'+(+m.pricing.completion*1e6).toFixed(2)+' per M</option>').join("");
    $("#lb-model").textContent = u.length+" 个模型可选，可直接输入 ID";
  }catch(e){ $("#lb-model").textContent = "模型列表载入失败，可手动输入 ID"; }
}
window.addEventListener("keydown", e=>{
  if(e.target.matches("input,textarea") || $("#m-set").classList.contains("on")) return;
  if((e.key===" "||e.key==="Enter") && $("#btn-roll")){ e.preventDefault(); doRoll(); }
});

loadCfg(); fillSetup(); offerResume(); loadModels();
</script>
</body>
</html>
