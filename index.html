<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>安科 · あんこスレ — 掷骰推进的随机剧情</title>
<style>
:root{
  --bg:#100e17; --bg2:#171423; --card:#1d1a2b; --card2:#241f36;
  --line:#332c4a; --line2:#463c63;
  --tx:#ece8f5; --tx2:#b3aac9; --tx3:#7d7396;
  --pink:#ff6ba8; --pink2:#ff8fbe; --purple:#9d7bff;
  --gold:#ffc861; --green:#5fd6a0; --red:#ff6b6b; --cyan:#6bd5e1;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","Hiragino Mincho ProN",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.7;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 500px at 12% -8%,rgba(255,107,168,.13),transparent 62%),
             radial-gradient(800px 500px at 88% 4%,rgba(157,123,255,.13),transparent 62%),
             radial-gradient(700px 600px at 50% 108%,rgba(255,200,97,.06),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::selection{background:rgba(255,107,168,.34)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid var(--bg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:10px;
  background:var(--card2);border:1px solid var(--line);color:var(--tx2);font-size:13.5px;font-weight:500;
  transition:.16s;white-space:nowrap}
.btn:hover{background:var(--line);color:var(--tx);border-color:var(--line2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,var(--pink),#e0559a);border-color:transparent;color:#fff;
  font-weight:600;box-shadow:0 4px 18px rgba(255,107,168,.3)}
.btn.primary:hover{background:linear-gradient(135deg,var(--pink2),var(--pink));color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--card2)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.danger:hover{background:rgba(255,107,107,.14);border-color:rgba(255,107,107,.4);color:var(--red)}

label.f{display:block;margin-bottom:16px}
label.f>.lb{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:12.5px;
  color:var(--tx2);font-weight:600;margin-bottom:7px;letter-spacing:.02em}
label.f .hint{font-weight:400;color:var(--tx3);font-size:11.5px}
.inp{width:100%;padding:10px 13px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);
  transition:.15s;font-size:14px}
.inp:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,107,168,.13)}
textarea.inp{resize:vertical;min-height:96px;line-height:1.65}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:3px;background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
  background:var(--pink);cursor:pointer;box-shadow:0 0 0 4px rgba(255,107,168,.18)}
.seg{display:flex;gap:6px;background:var(--bg2);padding:4px;border-radius:11px;border:1px solid var(--line)}
.seg button{flex:1;padding:7px 8px;border-radius:8px;font-size:13px;color:var(--tx3);transition:.14s}
.seg button.on{background:var(--card2);color:var(--pink2);font-weight:600}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch input{display:none}
.switch .track{width:40px;height:23px;border-radius:12px;background:var(--line);position:relative;transition:.2s;flex:none}
.switch .track::after{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;
  background:var(--tx3);transition:.2s}
.switch input:checked+.track{background:rgba(255,107,168,.3)}
.switch input:checked+.track::after{transform:translateX(17px);background:var(--pink)}

/* ===== SETUP ===== */
#setup{max-width:760px;margin:0 auto;padding:52px 22px 90px}
.brand{text-align:center;margin-bottom:34px}
.brand .zh{font-family:var(--serif);font-size:62px;font-weight:700;letter-spacing:.2em;line-height:1.1;
  background:linear-gradient(150deg,var(--pink) 5%,var(--purple) 55%,var(--gold) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand .jp{color:var(--tx3);font-size:13px;letter-spacing:.42em;margin-top:6px}
.brand .sub{color:var(--tx2);font-size:14.5px;margin-top:16px;line-height:1.8}
.brand .sub b{color:var(--pink2);font-weight:600}
.panel{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);
  border-radius:20px;padding:26px;margin-bottom:18px;box-shadow:0 18px 50px rgba(0,0,0,.4)}
.panel>h2{font-size:13px;letter-spacing:.16em;color:var(--tx3);font-weight:700;margin-bottom:18px;
  display:flex;align-items:center;gap:10px}
.panel>h2::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:7px 13px;border-radius:20px;background:var(--bg2);border:1px solid var(--line);
  font-size:12.5px;color:var(--tx2);transition:.15s}
.chip:hover{border-color:var(--pink);color:var(--pink2)}
.chip.on{background:rgba(255,107,168,.15);border-color:var(--pink);color:var(--pink2);font-weight:600}
.mode{padding:11px 14px;border-radius:11px;font-size:12.5px;line-height:1.7;margin-bottom:16px;
  border:1px solid rgba(107,213,225,.3);background:rgba(107,213,225,.07);color:#cdeef2}
.mode b{color:var(--cyan)}
.mode.own{border-color:rgba(255,200,97,.3);background:rgba(255,200,97,.07);color:#f3e3c2}
.mode.own b{color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.adv{border-top:1px solid var(--line);margin-top:6px;padding-top:16px}
.adv>summary{cursor:pointer;list-style:none;font-size:13px;color:var(--tx3);display:flex;align-items:center;gap:7px}
.adv>summary::-webkit-details-marker{display:none}
.adv>summary::before{content:'▸';transition:.2s;display:inline-block;color:var(--pink)}
.adv[open]>summary::before{transform:rotate(90deg)}
.adv .body{padding-top:18px}
.go{width:100%;padding:16px;font-size:16.5px;border-radius:14px;margin-top:4px}
.foot{text-align:center;color:var(--tx3);font-size:12px;margin-top:22px;line-height:1.9}

/* ===== GAME ===== */
#game{display:none;flex-direction:column;min-height:100%}
header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:11px 18px;
  background:rgba(16,14,23,.85);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
header .ttl{font-family:var(--serif);font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:min(40vw,360px)}
header .meta{display:flex;gap:7px;align-items:center;color:var(--tx3);font-size:11.5px;font-family:var(--mono)}
.tag{padding:3px 9px;border-radius:20px;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.tag.warn{color:var(--gold);border-color:rgba(255,200,97,.42)}
.tag.over{color:var(--red);border-color:rgba(255,107,107,.5);background:rgba(255,107,107,.13)}
header .sp{flex:1}
.hbtns{display:flex;gap:4px}
.btn.hot{color:var(--cyan);background:rgba(107,213,225,.14);border-color:rgba(107,213,225,.45)}
#feed{max-width:840px;width:100%;margin:0 auto;padding:26px 20px 40px;flex:1}

/* 只有「新出现」的东西才动画。整块重绘时不能带动画，否则每次重绘整个历史都会闪一下 */
.turn{margin-bottom:38px}
.pop{animation:rise .4s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tno{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-family:var(--mono);font-size:11.5px;
  color:var(--tx3);letter-spacing:.1em}
.tno .n{color:var(--pink2);font-weight:700;font-size:12.5px;padding:3px 11px;border-radius:20px;
  background:rgba(255,107,168,.1);border:1px solid rgba(255,107,168,.26)}
.tno::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

/* 场景抬头 [时间][地点] */
.scene{font-family:var(--mono);font-size:12.5px;color:var(--cyan);margin-bottom:12px;line-height:1.9;
  opacity:.9}
.scene div::before{content:'[';opacity:.5}
.scene div::after{content:']';opacity:.5}

.narr{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:24px 28px;font-family:var(--serif);font-size:16.5px;line-height:2.05;color:#f2eefb}
.narr::before,.narr::after{position:absolute;font-family:var(--serif);font-size:44px;color:var(--line2);
  line-height:1;opacity:.85}
.narr::before{content:'“';top:8px;left:9px}
.narr::after{content:'”';bottom:-4px;right:11px}
.narr p{margin:0 0 .95em}
.narr p:last-child{margin-bottom:0}
.narr b,.narr strong{color:var(--gold);font-weight:700}
.narr em{color:var(--pink2);font-style:normal;border-bottom:1px dashed rgba(255,107,168,.4)}
.narr .sp{color:var(--purple);font-weight:600}
.cursor{display:inline-block;width:8px;height:17px;background:var(--pink);vertical-align:-2px;
  margin-left:2px;animation:blink .9s steps(2,start) infinite;border-radius:1px}
@keyframes blink{to{visibility:hidden}}

/* 导游吐槽 */
.aside{font-family:var(--mono);font-size:12.5px;color:var(--tx3);background:rgba(157,123,255,.07);
  border-left:2px solid var(--purple);padding:7px 13px;margin:.9em 0;border-radius:0 7px 7px 0;
  line-height:1.7;letter-spacing:.02em}

/* 判定骰点行 */
.chk{margin:.9em 0;padding:10px 14px;border-radius:10px;background:rgba(255,200,97,.06);
  border:1px solid rgba(255,200,97,.2);font-family:var(--mono);font-size:12.5px;line-height:1.75}
.chk .q{color:var(--tx2);display:block;margin-bottom:3px}
.chk .q i{font-style:normal;color:var(--gold);opacity:.75;margin-right:6px}
.chk .mods{color:var(--tx3);font-size:11.5px}
.chk .mods s{text-decoration:none;color:var(--green)}
.chk .mods u{text-decoration:none;color:var(--red)}
.chk .eq{color:var(--gold);font-size:13px}
.chk .eq b{font-size:16px;font-weight:700}
.chk .out{margin-left:8px;padding:1px 8px;border-radius:5px;background:rgba(255,200,97,.15);font-size:12px}
.chk.crit{background:rgba(95,214,160,.09);border-color:rgba(95,214,160,.35)}
.chk.crit .eq,.chk.crit .q i{color:var(--green)}
.chk.crit .out{background:rgba(95,214,160,.2);color:var(--green)}
.chk.fumb{background:rgba(255,107,107,.09);border-color:rgba(255,107,107,.35)}
.chk.fumb .eq,.chk.fumb .q i{color:var(--red)}
.chk.fumb .out{background:rgba(255,107,107,.2);color:var(--red)}
.chk.hide{background:rgba(125,115,150,.08);border-color:var(--line)}
.chk.hide .eq{color:var(--tx3)}
.chk.aff{background:rgba(255,107,168,.07);border-color:rgba(255,107,168,.24)}
.chk.aff .eq,.chk.aff .q i{color:var(--pink2)}
.chk.aff .out{background:rgba(255,107,168,.16);color:var(--pink2)}

/* 人物卡 */
.card{margin-top:16px;background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:18px 20px}
.card .ch{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--gold);
  margin-bottom:12px;display:flex;align-items:center;gap:9px}
.card .ch::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin-bottom:12px}
.at{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:9px;
  padding:7px 11px;font-family:var(--mono);font-size:12.5px;display:flex;align-items:baseline;
  gap:8px;overflow:hidden}
.at i{font-style:normal;color:var(--tx2);flex:1}
.at b{font-size:16px;font-weight:700;color:var(--tx);position:relative;z-index:1}
.at em{position:absolute;left:0;bottom:0;height:2px;background:var(--tx3);border-radius:2px}
.at.hi{border-color:rgba(95,214,160,.45)}
.at.hi b{color:var(--green)} .at.hi em{background:var(--green)}
.at.lo{border-color:rgba(255,107,107,.45)}
.at.lo b{color:var(--red)} .at.lo em{background:var(--red)}
.at i u{text-decoration:none;color:var(--gold);font-size:11px;vertical-align:super}
.esc{margin-top:9px;padding:9px 13px;border-radius:9px;background:rgba(157,123,255,.09);
  border:1px solid rgba(157,123,255,.28);border-left:3px solid var(--purple);line-height:1.75}
.esc .q i{color:var(--purple)}
.esc .eq{color:var(--purple)}
.esc .eq .out{background:rgba(157,123,255,.2);color:#d9c8ff}
/* 光谱位置条：把百分位画出来，免得中间值被读成极值 */
.spec{display:block;position:relative;height:5px;border-radius:3px;margin:7px 0 2px;
  background:linear-gradient(90deg,rgba(107,213,225,.35),var(--line),rgba(255,107,168,.35))}
.spec::before{content:'';position:absolute;left:50%;top:-2px;width:1px;height:9px;
  background:var(--line2)}
.spec i{position:absolute;top:-4px;width:3px;height:13px;border-radius:2px;
  background:var(--gold);box-shadow:0 0 8px rgba(255,200,97,.8);transform:translateX(-50%)}
.ck{display:inline-flex;gap:4px;align-items:center;margin-left:9px;vertical-align:middle}
.mini{padding:1px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--tx3);
  font-size:11px;line-height:1.6;transition:.15s}
.mini:hover{color:var(--purple);border-color:var(--purple);background:rgba(157,123,255,.14)}
.mini.on{color:var(--gold);border-color:var(--gold);background:rgba(255,200,97,.16)}
.mini-n{width:46px;padding:1px 5px;border-radius:6px;background:var(--bg2);
  border:1px solid var(--line);font-family:var(--mono);font-size:11px;text-align:center;color:var(--tx2)}
.cheatbar .lb2{font-size:11.5px;color:var(--tx3);width:100%;margin-bottom:2px}
.cheatbar{display:flex;gap:7px;align-items:center;margin-top:12px;flex-wrap:wrap;
  padding:9px 12px;border-radius:10px;background:rgba(157,123,255,.06);
  border:1px dashed rgba(157,123,255,.3)}
.cheatbar .lb:first-child{color:var(--purple);font-weight:600}
.cheatbar .lb{font-family:var(--mono);font-size:11.5px;color:var(--tx3)}
.cheatbar input{width:58px;padding:5px 8px;border-radius:8px;background:var(--bg2);
  border:1px solid var(--line);font-family:var(--mono);font-size:13px;text-align:center}

/* 状态 / 好感 / 线索 */
.stat{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.stat .s{font-size:12px;padding:5px 11px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);
  color:var(--tx2);font-family:var(--mono)}
.stat .s i{font-style:normal;color:var(--tx3);margin-right:6px}
.stat .s b{color:var(--gold);font-weight:600}
.clue{margin-top:12px;padding:11px 15px;border-radius:10px;background:rgba(107,213,225,.07);
  border:1px solid rgba(107,213,225,.25);font-size:13.5px;color:#cdeef2;line-height:1.75}
.clue .h{font-family:var(--mono);font-size:11px;color:var(--cyan);letter-spacing:.1em;display:block;margin-bottom:4px}
.affrow{margin-top:12px;display:flex;flex-wrap:wrap;gap:7px}
.affrow .a{font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:7px;
  background:rgba(255,107,168,.08);border:1px solid rgba(255,107,168,.22);color:var(--pink2)}
.affrow .a u{text-decoration:none;color:var(--tx2)}

/* 交锋 */
.duel{margin:16px 0;border:1px solid rgba(157,123,255,.35);border-radius:var(--r);overflow:hidden;
  background:rgba(157,123,255,.05)}
.duel .dh{padding:12px 16px;background:rgba(157,123,255,.12);font-size:13.5px;font-weight:600;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.duel .dh .k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--purple)}
.duel .bar{display:flex;align-items:center;gap:3px;padding:11px 16px;border-bottom:1px solid rgba(157,123,255,.2)}
.duel .bar .c{flex:1;height:7px;border-radius:4px;background:var(--line);transition:.3s}
.duel .bar .c.us{background:var(--pink)}
.duel .bar .c.them{background:var(--purple)}
.duel .bar .nm{font-family:var(--mono);font-size:11px;color:var(--tx3);white-space:nowrap;padding:0 6px}
.duel .rd{padding:9px 16px;font-family:var(--mono);font-size:12px;color:var(--tx2);
  border-bottom:1px solid rgba(157,123,255,.12);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.duel .rd:last-child{border-bottom:none}
.duel .rd .n{color:var(--tx3);flex:none;width:52px}
.duel .rd .s{flex:1;min-width:150px}
.duel .rd .s.w{color:var(--gold);font-weight:700}
.duel .rd .adv{color:var(--purple);font-size:11px}
.duel .win{padding:12px 16px;font-size:14px;font-weight:600;color:var(--gold);
  background:rgba(255,200,97,.08)}

/* 选项 */
.opts{margin-top:16px;display:flex;flex-direction:column;gap:5px}
.opts .hd{font-size:11.5px;color:var(--tx3);letter-spacing:.16em;font-weight:700;margin-bottom:5px;
  display:flex;align-items:center;gap:9px}
.opts .hd::after{content:'';flex:1;height:1px;background:var(--line)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:9px 14px;border-radius:10px;
  border:1px solid transparent;background:var(--bg2);transition:.2s;font-size:14.5px;color:var(--tx2);
  text-align:left;width:100%}
.opt .i{flex:none;width:23px;height:23px;border-radius:7px;background:var(--card2);color:var(--tx3);
  font-family:var(--mono);font-size:12px;font-weight:700;display:flex;align-items:center;
  justify-content:center;margin-top:1px;transition:.2s}
.opt .t{flex:1;line-height:1.6}
.opt.q .t{color:var(--purple);font-weight:600;letter-spacing:.1em}
.opt.q .i{background:rgba(157,123,255,.18);color:var(--purple)}
.opt.win{background:linear-gradient(100deg,rgba(255,107,168,.17),rgba(255,107,168,.05));
  border-color:rgba(255,107,168,.5);color:#fff;font-weight:600}
.opt.win .i{background:var(--pink);color:#fff}
.opt.win::after{content:'← 选中';margin-left:auto;flex:none;font-size:11px;color:var(--pink2);
  font-family:var(--mono);align-self:center;white-space:nowrap}
.opt.dim{opacity:.4}
.opt.pick{cursor:pointer}
.opt.pick:hover{background:var(--card2);border-color:var(--line2);color:var(--tx)}

.rollline{margin-top:14px;display:flex;flex-wrap:wrap;gap:9px;align-items:center;font-family:var(--mono);
  font-size:13px;color:var(--gold);background:rgba(255,200,97,.07);border:1px solid rgba(255,200,97,.22);
  padding:9px 14px;border-radius:10px}
.rollline .lbl{color:var(--tx3)}
.rollline .v{font-size:16px;font-weight:700}
.rollline.chaos{color:var(--purple);background:rgba(157,123,255,.09);border-color:rgba(157,123,255,.3)}
.rollline.manual{color:var(--green);background:rgba(95,214,160,.07);border-color:rgba(95,214,160,.24)}

/* 章节结算 */
.settle{margin:30px 0;border:1px solid var(--line2);border-radius:var(--r);background:var(--card);
  padding:20px 22px}
.settle h3{font-family:var(--serif);font-size:17px;margin-bottom:14px;color:var(--gold)}
.settle .grp{margin-bottom:12px}
.settle .grp b{font-size:11.5px;color:var(--tx3);letter-spacing:.1em;display:block;margin-bottom:6px}

.dock{position:sticky;bottom:0;z-index:30;margin:0 -20px;padding:16px 20px 20px;
  background:linear-gradient(180deg,transparent,var(--bg) 26%)}
.dock .in{max-width:800px;margin:0 auto;background:var(--card);border:1px solid var(--line2);
  border-radius:16px;padding:14px;box-shadow:0 -6px 34px rgba(0,0,0,.5)}
.rollbtn{width:100%;padding:15px;font-size:16px;border-radius:12px;letter-spacing:.06em}
.rollbtn .d{font-family:var(--mono);opacity:.75;font-size:13px}
.anka{display:flex;gap:8px;margin-top:11px}
.anka input{flex:1}
.anka.hide{display:none}
.dockmsg{text-align:center;color:var(--tx3);font-size:12.5px;padding:4px 0}
.load{display:flex;align-items:center;gap:11px;color:var(--tx3);font-size:13.5px;padding:14px 4px}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--pink);animation:bob .9s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-5px)}}
.err{background:rgba(255,107,107,.09);border:1px solid rgba(255,107,107,.34);border-radius:12px;
  padding:15px 17px;color:#ffb0b0;font-size:13.5px;margin:10px 0}
.err b{display:block;color:var(--red);margin-bottom:6px;font-size:14px}
.err .m{font-family:var(--mono);font-size:12px;color:#e9a0a0;word-break:break-word;max-height:150px;
  overflow:auto;line-height:1.55}
.err .btns{margin-top:12px;display:flex;gap:8px}

/* 骰子overlay */
#dice{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:26px;background:rgba(10,8,16,.9);backdrop-filter:blur(9px)}
#dice.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.d10{width:190px;height:190px;position:relative;display:flex;align-items:center;justify-content:center}
.d10 svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 34px rgba(255,107,168,.55))}
.d10 .num{position:relative;font-family:var(--mono);font-size:70px;font-weight:700;color:#fff;z-index:2}
.d10.spin{animation:tumble .42s linear infinite}
@keyframes tumble{0%{transform:rotate(0) scale(1)}25%{transform:rotate(90deg) scale(1.06)}
  50%{transform:rotate(180deg) scale(.95)}75%{transform:rotate(270deg) scale(1.06)}100%{transform:rotate(360deg)}}
.d10.land{animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(1.35)}60%{transform:scale(.94)}100%{transform:scale(1)}}
#dice .cap{font-family:var(--mono);color:var(--tx2);font-size:15px;letter-spacing:.14em}
#dice .res{font-size:20px;font-family:var(--serif);color:var(--pink2);font-weight:700;text-align:center;
  max-width:min(560px,86vw);line-height:1.6;opacity:0;transition:.4s}
#dice .res.on{opacity:1}
#dice .res .k{color:var(--purple)}#dice .res .g{color:var(--green)}#dice .res .r{color:var(--red)}
#dice .lbl2{font-family:var(--sans);font-size:15px;color:var(--tx2);max-width:min(620px,88vw);
  text-align:center;line-height:1.6}
.dopts{display:flex;flex-direction:column;gap:6px;max-width:min(620px,88vw);width:100%}
.dopts .do{padding:9px 15px;border-radius:10px;background:rgba(255,255,255,.045);
  border:1px solid var(--line);color:var(--tx3);font-size:14px;display:flex;gap:11px;
  align-items:flex-start;transition:.35s;opacity:.55}
.dopts .do i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--tx3);
  flex:none;min-width:34px;padding-top:2px}
.dopts .do.win{opacity:1;background:linear-gradient(100deg,rgba(255,107,168,.22),rgba(255,107,168,.06));
  border-color:var(--pink);color:#fff;font-weight:600;transform:scale(1.02)}
.dopts .do.win i{color:var(--pink2)}

.modal{position:fixed;inset:0;z-index:90;display:none;background:rgba(9,7,14,.76);backdrop-filter:blur(7px);
  align-items:flex-start;justify-content:center;padding:34px 18px;overflow-y:auto}
.modal.on{display:flex}
.modal .box{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line2);
  border-radius:20px;padding:26px;max-width:600px;width:100%;animation:rise .28s}
.panel{animation:none}
.modal .box h2{font-size:19px;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.modal .box h2 .x{margin-left:auto;font-size:22px;color:var(--tx3);line-height:1;padding:0 5px}
.mfoot{display:flex;gap:9px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.mfoot .sp{flex:1}
.note{font-size:12px;color:var(--tx3);line-height:1.75;margin:-8px 0 16px}
.ledger{font-family:var(--mono);font-size:12.5px;line-height:2}
.ledger .r{display:flex;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.ledger .r span:first-child{flex:1;color:var(--tx2)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card2);
  border:1px solid var(--line2);border-radius:11px;padding:11px 20px;font-size:13.5px;z-index:200;
  transition:.3s;opacity:0;pointer-events:none}
.toast.on{transform:translateX(-50%);opacity:1}

@media(max-width:640px){
  .brand .zh{font-size:46px}
  #setup{padding:34px 15px 70px}

  #feed{padding:18px 14px 30px}
  .narr{padding:20px;font-size:16px;line-height:1.95}

</head>
<body>

<div id="setup">
  <div class="brand">
    <div class="zh">安科</div>
    <div class="jp">あ ん こ ス レ</div>
    <div class="sub">
      主持人写剧情、抛出 <b>10 个走向</b>，由 <b>1D10</b> 决定命运。<br>
      路上凡是拿不准的事，全都<b>当场掷骰</b>——判定、好感、暗骰，一个不少。
    </div>
  </div>

  <div class="panel">
    <h2>剧本设定</h2>
    <div class="chips" id="presets"></div>
    <label class="f">
      <span class="lb"><span>标题</span></span>
      <input class="inp" id="f-title" placeholder="给这篇安科起个名字">
    </label>
    <label class="f">
      <span class="lb"><span>前提 / 开局设定</span><span class="hint">写得越具体，主持人越好发挥</span></span>
      <textarea class="inp" id="f-premise" rows="5" placeholder="例：萌百娘升入初中，进入新学校的第一天。轻松校园喜剧，日常里偶尔混进一点超展开。"></textarea>
    </label>
    <div class="row2">
      <label class="f" style="margin-bottom:0">
        <span class="lb"><span>混沌度</span><span class="hint" id="lb-chaos">3 · 平衡</span></span>
        <input type="range" id="f-chaos" min="1" max="5" step="1" value="3">
      </label>
      <label class="f" style="margin-bottom:0">
        <span class="lb"><span>正文长度</span></span>
        <div class="seg" id="f-len">
          <button data-v="short">短</button><button data-v="mid" class="on">中</button><button data-v="long">长</button>
        </div>
      </label>
    </div>
  </div>

  <div class="panel">
    <h2>模型 / API</h2>
    <div class="mode" id="modebox"></div>
    <label class="f">
      <span class="lb"><span id="lb-key">OpenRouter API Key</span><span class="hint">存在本机浏览器，不会上传到别处</span></span>
      <input class="inp" id="f-key" type="password" placeholder="sk-or-v1-...">
    </label>
    <label class="f">
      <span class="lb"><span>模型</span><span class="hint" id="lb-model">载入中…</span></span>
      <input class="inp" id="f-model" list="modellist" placeholder="~google/gemini-flash-latest">
      <datalist id="modellist"></datalist>
    </label>
    <div class="chips" id="modelchips"></div>
    <details class="adv">
      <summary>进阶选项</summary>
      <div class="body">
        <div class="row2">
          <label class="f">
            <span class="lb"><span>温度</span><span class="hint" id="lb-temp">1.00</span></span>
            <input type="range" id="f-temp" min="0" max="2" step="0.05" value="1">
          </label>
          <label class="f">
            <span class="lb"><span>完整保留的回合数</span><span class="hint" id="lb-mem">3</span></span>
            <input type="range" id="f-mem" min="1" max="12" step="1" value="3">
          </label>
        </div>
        <label class="switch" style="margin-bottom:13px">
          <input type="checkbox" id="f-autocompact" checked><span class="track"></span>
          <span style="font-size:13.5px"><b style="color:var(--green)">自动压缩前情</b>：更早的回合攒够长度就交给模型写成一份「前情提要」，之后不再逐回合进 prompt。上下文不随回合数一直变长，长篇不会越玩越贵（页面上的正文一个字都不少）</span>
        </label>
        <label class="switch" style="margin-bottom:13px">
          <input type="checkbox" id="f-chargen" checked><span class="track"></span>
          <span style="font-size:13.5px"><b style="color:var(--gold)">开局骰</b>：开场先摇世界观与主角八项属性，之后属性会挂进判定</span>
        </label>
        <label class="switch" style="margin-bottom:13px">
          <input type="checkbox" id="f-bigroll" checked><span class="track"></span>
          <span style="font-size:13.5px"><b style="color:var(--gold)">大判定走掷骰页面</b>：导游标记为关键的判定（如「同桌是怎样的人」）弹出掷骰动画；也可以自己点 ★ 标记</span>
        </label>
        <label class="switch" style="margin-bottom:13px">
          <input type="checkbox" id="f-bigtables"><span class="track"></span>
          <span style="font-size:13.5px">连带把<b>所有</b> D10表 / 极性 都算成大判定（会弹得比较频繁）</span>

        <label class="switch" style="margin-bottom:13px">
          <input type="checkbox" id="f-thrift" checked><span class="track"></span>

        </label>
        <label class="switch" style="margin-bottom:13px">
          <input type="checkbox" id="f-sepopts" checked><span class="track"></span>
          <span style="font-size:13.5px"><b style="color:var(--pink2)">走向单独生成</b>：10 个走向另开一次调用，并列出已用过的走向避重（治重复感）</span>
        </label>
        <label class="switch" style="margin-bottom:13px">
          <input type="checkbox" id="f-fast"><span class="track"></span>
          <span style="font-size:13.5px"><b style="color:var(--cyan)">⚡ 快速模式</b>：跳过掷骰动画，直接出结果</span>
        </label>
        <label class="switch" style="margin-bottom:13px">
          <input type="checkbox" id="f-cheat"><span class="track"></span>
          <span style="font-size:13.5px"><b style="color:var(--purple)">作弊模式</b>：默认一切听骰子的；开了可以改任意判定的点数再重写本回合</span>
        </label>
        <label class="f" style="margin-top:4px">
          <span class="lb"><span>意外事件池</span><span class="hint">一行一条，每回合 1D100 ≥85 时随机抽一条塞进剧情</span></span>
          <textarea class="inp" id="f-pool" rows="3" placeholder="停电了&#10;有人在楼下大喊主角的名字&#10;手机收到一条没有发件人的短信"></textarea>
        </label>
        <label class="switch" style="margin-bottom:13px">
          <input type="checkbox" id="f-plan" checked><span class="track"></span>
          <span style="font-size:13.5px"><b style="color:var(--gold)">判定阶段</b>：先声明判定再摇骰，模型无法挑点数（每回合两次调用）</span>
        </label>
        <label class="switch" style="margin-bottom:13px">
          <input type="checkbox" id="f-duel" checked><span class="track"></span>
          <span style="font-size:13.5px">启用<b style="color:var(--purple)">言论交锋</b>（拔河式优势推进）</span>
        </label>
        <label class="switch" style="margin-bottom:13px">
          <input type="checkbox" id="f-anka" checked><span class="track"></span>
          <span style="font-size:13.5px">允许<b style="color:var(--green)">安价</b>：可以放弃掷骰，直接指定走向</span>
        </label>
        <label class="switch" style="margin-bottom:13px">
          <input type="checkbox" id="f-status" checked><span class="track"></span>
          <span style="font-size:13.5px">显示<b style="color:var(--gold)">状态栏</b></span>
        </label>
        <label class="switch">
          <input type="checkbox" id="f-sound" checked><span class="track"></span>
          <span style="font-size:13.5px">掷骰音效</span>
        </label>
      </div>
    </details>
  </div>

  <button class="btn primary go" id="btn-start">开始安科</button>
  <div id="resume-wrap"></div>
  <div class="foot">
    安科（あんこスレ）起源于日本 AA 漫画：作者自设约 10 个剧情走向，再用骰子决定采用哪一个。<br>
    所有骰点由 <code style="font-family:var(--mono);color:var(--tx2)">crypto.getRandomValues</code> 生成，主持人无法干预。
  </div>
</div>

<div id="game">
  <header>
    <div class="ttl" id="g-title">未命名安科</div>
    <div class="meta">
      <span class="tag" id="g-turn">第 0 回</span>
      <span class="tag" id="g-model">—</span>
      <span class="tag" id="g-cost">$0.0000</span>
    </div>
    <div class="sp"></div>
    <div class="hbtns">
      <button class="btn ghost sm" id="btn-fast" title="快速模式：跳过掷骰动画">⚡</button>
      <button class="btn ghost sm" id="btn-ledger" title="好感度 / 线索">📖</button>
      <button class="btn ghost sm" id="btn-settings" title="设置">⚙</button>
      <button class="btn ghost sm" id="btn-export">导出</button>
      <button class="btn ghost sm" id="btn-new">新开</button>
    </div>
  </header>
  <div id="feed"></div>
</div>

<div id="dice">
  <div class="cap" id="d-cap">1D10</div>
  <div class="d10" id="d-shape">
    <svg viewBox="0 0 100 100">
      <defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ff8fbe"/><stop offset="52%" stop-color="#e0559a"/>
        <stop offset="100%" stop-color="#9d7bff"/></linearGradient></defs>
      <polygon points="50,3 92,32 76,88 24,88 8,32" fill="url(#dg)" stroke="#fff" stroke-width="1.6" stroke-opacity=".55"/>
      <polygon points="50,3 76,88 24,88" fill="#fff" fill-opacity=".1"/>

  <div class="res" id="d-res"></div>
  <div class="dopts" id="d-opts"></div>
</div>

<div class="modal" id="m-set"><div class="box">
  <h2>设置 <button class="x" data-close>×</button></h2>

    <input class="inp" id="s-key" type="password"></label>
  <label class="f"><span class="lb"><span>模型</span></span>
    <input class="inp" id="s-model" list="modellist"></label>
  <div class="row2">
    <label class="f"><span class="lb"><span>混沌度</span><span class="hint" id="s-lb-chaos">3</span></span>

    <label class="f"><span class="lb"><span>温度</span><span class="hint" id="s-lb-temp">1.00</span></span>

  </div>
  <label class="f"><span class="lb"><span>正文长度</span></span>

  <label class="switch" style="margin-bottom:12px"><input type="checkbox" id="s-bigroll"><span class="track"></span>
    <span style="font-size:13.5px">大判定走掷骰页面</span></label>
  <label class="switch" style="margin-bottom:12px"><input type="checkbox" id="s-bigtables"><span class="track"></span>
    <span style="font-size:13.5px">所有 D10表 / 极性 都算大判定</span></label>
  <label class="switch" style="margin-bottom:12px"><input type="checkbox" id="s-thrift"><span class="track"></span>
    <span style="font-size:13.5px">省钱模式（关闭模型思考）</span></label>
  <label class="switch" style="margin-bottom:12px"><input type="checkbox" id="s-sepopts"><span class="track"></span>
    <span style="font-size:13.5px">走向单独生成（治重复感）</span></label>
  <label class="switch" style="margin-bottom:12px"><input type="checkbox" id="s-autocompact"><span class="track"></span>
    <span style="font-size:13.5px">自动压缩前情（长篇省钱，页面正文不受影响）</span></label>
  <label class="switch" style="margin-bottom:12px"><input type="checkbox" id="s-fast"><span class="track"></span>
    <span style="font-size:13.5px">⚡ 快速模式（跳过掷骰动画，直接出结果）</span></label>
  <label class="switch" style="margin-bottom:12px"><input type="checkbox" id="s-cheat"><span class="track"></span>
    <span style="font-size:13.5px">作弊模式（可改判定点数并重写）</span></label>
  <label class="f" style="margin-top:4px">
    <span class="lb"><span>意外事件池</span><span class="hint">一行一条</span></span>
    <textarea class="inp" id="s-pool" rows="3"></textarea>
  </label>
  <label class="switch" style="margin-bottom:12px"><input type="checkbox" id="s-plan"><span class="track"></span>
    <span style="font-size:13.5px">判定阶段（两次调用）</span></label>
  <label class="switch" style="margin-bottom:12px"><input type="checkbox" id="s-duel"><span class="track"></span>
    <span style="font-size:13.5px">言论交锋</span></label>
  <label class="switch" style="margin-bottom:12px"><input type="checkbox" id="s-anka"><span class="track"></span>
    <span style="font-size:13.5px">允许安价</span></label>
  <label class="switch" style="margin-bottom:12px"><input type="checkbox" id="s-status"><span class="track"></span>
    <span style="font-size:13.5px">显示状态栏</span></label>
  <label class="switch"><input type="checkbox" id="s-sound"><span class="track"></span>
    <span style="font-size:13.5px">掷骰音效</span></label>
  <details class="adv" style="margin-top:18px"><summary>剧本设定（当前局）</summary><div class="body">
    <label class="f"><span class="lb"><span>标题</span></span><input class="inp" id="s-title"></label>
    <label class="f" style="margin-bottom:0"><span class="lb"><span>前提</span></span>

  <div class="mfoot">

    <button class="btn" data-close>取消</button>
    <button class="btn primary" id="s-save">保存</button>
  </div>
</div></div>

<div class="modal" id="m-led"><div class="box">
  <h2>好感度 / 线索 <button class="x" data-close2>×</button></h2>
  <div id="led-body"></div>
  <div class="mfoot"><span class="sp"></span><button class="btn" data-close2>关闭</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   安科 Anko Player
   模型现场生成剧情与走向；所有骰点由 crypto 决定，主持人无法干预。
   ============================================================ */

const API = "https://openrouter.ai/api/v1";

/* 这个页面是公开托管的，所以**页面里不放任何 key**。
   默认请求打到自己的 Cloudflare Worker，key 只存在 Worker 的 secret 里，
   浏览器读不到、git 历史里也没有。部署 proxy/ 之后把地址填到下面。
   访客也可以在设置里填自己的 OpenRouter key —— 那样直连、模型随便挑、费用走他们自己。 */
const PROXY_URL    = "https://anko-proxy.account-85d.workers.dev";                            // 例："https://anko-proxy.你的账号.workers.dev"
const PROXY_MODEL  = "~google/gemini-flash-latest"; // 代理端白名单里的模型

/* ---- 真随机（拒绝采样，无模偏） ---- */
function roll(sides){
  const lim = Math.floor(4294967296 / sides) * sides;
  const a = new Uint32Array(1);
  do { crypto.getRandomValues(a); } while (a[0] >= lim);
  return (a[0] % sides) + 1;
}

  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

/* ── OpenRouter 归因 ───────────────────────────────────────────────
   踩过的坑：X-Title 不是「这次请求的标签」，而是 app 的显示名，
   而 app 的身份由 HTTP-Referer 那个 URL 决定（文档原话：primary
   identifier for rankings）。每回合换一次 X-Title，只会把
   openrouter.ai/apps 上同一个 app 的名字反复改写，什么也分不出来。

   真正按请求落库的是 body 里的两个字段，实测 /api/v1/generation
   会原样返回：session_id 和 user（记作 external_user）。
   metadata 也收 200，但同一条 generation 记录里查不到它——写进去等于
   写进黑洞，所以不发。
   session_id 超过 256 字符上游直接 400，标题是玩家自由输入，必须先截。 */

   先截标题再拼 id，保证 id 不会被 256 的上限切掉。 */
function sessionId(){

}

/* ── 一局的花销上限 ───────────────────────────────────────────────
   game.cost 是这一局的累计花销（每次调用的 usage 结算进去，见 bill）。
   到顶就一个请求都不再发——不是提醒，是硬停。新开一局重新计数。 */
const COST_CAP = 2;
const overCap  = () => (game.cost || 0) >= COST_CAP;
/* 预算和「用户按了停止」是一类事：别再往下走，也别重试。
   两个吞异常继续跑的地方（走向重试、D10 表升级）必须原样把它抛出去，
   否则会被当成一次普通失败，接着再发一个注定被拦下的请求。 */
function budgetErr(){
  const e = new Error("这一局已经花掉 $" + (game.cost||0).toFixed(4) + "，到了 $"
    + COST_CAP.toFixed(2) + " 的上限。\n\n可以「导出」把这篇存下来，然后新开一局。");
  e.name = "BudgetError";
  return e;
}
const fatalErr = e => e.name === "AbortError" || e.name === "BudgetError";

/* 台账用的角色名：剥掉模型可能加上的修饰与后缀，避免同一角色分裂成多条 */
function cleanName(s){
  return String(s).trim()
    .replace(/^[的地得\s]+/,"")
    .replace(/[的之]?(初次|首次|当前|目前)?(好感度?|印象|评价)$/,"")
    .replace(/[「」『』《》"'“”]/g,"")
    .replace(/[的]$/,"")
    .trim() || String(s).trim();
}

/* [好感] 只该用于「角色甲 对 角色乙」，结果是 -3～+3 的关系值。
   模型常拿它去量「某人对某事的警惕程度（0为…100为…）」——那是 0-100 的量表，
   套进 -3～+3 会得出毫无意义的数字，还会往好感台账里塞进一本书之类的东西。
   这里就地识别并改判成 [光谱]（能抠出两端就用两端）或普通 [D100]。 */
function affMisuse(label){
  const m = label.match(/^(.+?)\s*(?:对|→|->)\s*(.+)$/);
  if(!m) return true;                                   // 连「对」都没有
  if(/[0-9０-９]\s*为/.test(label)) return true;          // 「0为…100为…」是量表写法
  const b = m[2].trim();
  if(/(程度|感觉|态度|评价|指数|意愿|倾向|反应|印象值)$/.test(b)) return true;
  if(b.length > 12) return true;                        // 角色名不会这么长
  return false;
}
function scalePoles(s){
  const lo = s.match(/[0０]\s*为\s*[「『"'“”]?([^，,、）)」』"'“”]+)/);
  const hi = s.match(/(?:100|１００)\s*为\s*[「『"'“”]?([^，,、）)」』"'“”]+)/);
  return (lo && hi) ? [lo[1].trim(), hi[1].trim()] : null;
}

const KIND_LB = { d100:"判定", roll:"骰", attr:"属性", polar:"极性", spectrum:"光谱", table:"D10表",
                  tier:"分档", stat:"检定", aff:"好感", hidden:"暗骰" };

/* 骰式：1D70+30 / D100 / 2D6-1 */
function parseSpec(s){
  const m = String(s).replace(/\s/g,"").match(/^(\d*)[dD](\d+)([+＋\-－−]\d+)?$/);
  if(!m) return null;
  const b = m[3] ? parseInt(m[3].replace(/[＋]/g,"+").replace(/[－−]/g,"-"),10) : 0;
  return { n: Math.max(1,Math.min(10, +(m[1]||1))), faces: Math.max(2,Math.min(1000, +m[2])), bonus: b };
}
function rollSpec(sp){
  const parts = [];
  for(let i=0;i<sp.n;i++) parts.push(roll(sp.faces));
  const raw = parts.reduce((a,b)=>a+b,0);
  return { parts, raw, total: raw + sp.bonus };
}
/* 选项切分：分隔符按优先级选。「、」在中文选项内部太常见
   （「带着星星眼、不太好惹的金发大波妹」），只有没有更明确的分隔符时才用它。 */
function splitOpts(inner){
  const sp = /[｜|]/.test(inner) ? /[｜|]/
           : inner.indexOf("/")>=0 ? /\//
           : /[、·]/.test(inner) ? /[、·]/ : null;
  return (sp ? inner.split(sp) : [inner])
    .map(x=>x.trim().replace(/^[—\-]+|[—\-]+$/g,"").replace(/^\d+\s*[.、．)]\s*/,""))
    .filter(Boolean);
}
/* 从一段文本里抠出最外层《…》。选项内部可能嵌书名号，所以贪婪到最后一个 》 */
function grabAngle(s){
  const m = s.match(/《([\s\S]*)》/) || s.match(/《([\s\S]*)$/);
  return m ? m[1] : null;
}

/* D10表：把 N 个选项均匀铺到 1..faces-1 上（第 faces 面固定留给 ？？？？）。
   给满 9 个就是一面一个选项，给 3 个就是 1-3/4-6/7-9。 */
function tableIndex(c){
  const n = ((c && c.opts) || []).length;
  if(!n) return -1;
  const span = Math.max(1, c.spec.faces - 1);
  return Math.min(n-1, Math.floor((c.raw-1) * n / span));
}
function tableRanges(c){
  const list = (c && c.opts) || [];
  if(!list.length) return [];                    // 没有选项就没有区间，别再往下算
  const span = Math.max(1, c.spec.faces - 1), n = list.length;
  const out = list.map(t=>({ lo:null, hi:null, text:t }));
  for(let v=1; v<=span; v++){
    const k = Math.min(n-1, Math.floor((v-1) * n / span));
    if(out[k].lo === null) out[k].lo = v;
    out[k].hi = v;
  }
  return out.filter(x=>x.lo !== null);
}
const rangeTag = r => r.lo===r.hi ? String(r.lo) : r.lo+"-"+r.hi;

/* 光谱描述词。
   端点常常是「微毫无损」「应声断裂」这种绝对化说法，直接粘前缀会得到
   「略偏微毫无损」这种既不通顺、又把中间值读成极值的结果。
   所以端点一律加「」当标签引用，并把百分位一起写出来。 */
function spectrumWord(v,a,b){
  const q = s => "「"+s+"」";
  if(v<=10) return q(a)+"到极致（"+v+"/100）";
  if(v<=30) return "明显偏"+q(a)+"（"+v+"/100）";
  if(v<=44) return "略偏"+q(a)+"（"+v+"/100）";
  if(v<=56) return "正卡在两者中间（"+v+"/100）";
  if(v<=70) return "略偏"+q(b)+"（"+v+"/100）";
  if(v<=90) return "明显偏"+q(b)+"（"+v+"/100）";
  return q(b)+"到极致（"+v+"/100）";
}

/* 解析判定申请 */
function parseChecks(txt, limit){
  const out = [];
  txt.split("\n").forEach(line=>{
    const l = line.trim();
    if(!l || /[=＝]{2,}/.test(l)) return;
    // 行首要容忍模型的各种修饰：项目符号、引用号、markdown 加粗、编号。
    // 对话一长模型就爱加这些，以前一加就整行解析不出来，判定会静默消失。
    const m = l.match(/^[\s\-*>#•·—]*\d*\s*[.、．)]?\s*\**\s*[\[【]\s*([^\]】]{1,16})\s*[\]】]\**\s*[:：]?\s*(.+)$/);
    if(!m) return;
    let tag = m[1].replace(/\*/g,"").trim();
    const big = /[!！]/.test(tag);          // [D10表!] —— 导游标记的大判定
    tag = tag.replace(/[!！]/g,"").trim();
    let rest = m[2].trim().replace(/\*\*/g,"").replace(/\s*\*+\s*$/,"").trim();

    // 各段的书写顺序不固定，所以逐个「就地摘除」，不能靠行尾锚定
    // 难度
    let diff = null;
    const dm = rest.match(/难度\s*(\d+)/);
    if(dm){ diff = +dm[1]; rest = (rest.slice(0,dm.index)+rest.slice(dm.index+dm[0].length)).trim(); }

    // 选项：《A｜B｜C》 或 《贫瘠——丰满》
    // 两个坑：分档选项内部含有 ">"，所以字符类不能排除它；
    // 选项内部还可能嵌书名号（「能弹奏《欢乐颂》的电子琴」），
    // 所以要贪婪匹配到最后一个 》，取最外层那一对。
    let opts = [], poles = null, angleRaw = null;
    const om = rest.match(/《([\s\S]*)》/) || rest.match(/<([\s\S]*)>/)
            || rest.match(/《([\s\S]*)$/);   // 模型把结尾截断了也要能救回来
    if(om) angleRaw = om[1];
    if(om){
      const inner = om[1].trim();
      const dash = inner.match(/^(.+?)\s*[—－\-]{2,}\s*(.+)$/);
      if(dash) poles = [dash[1].trim(), dash[2].trim()];
      opts = splitOpts(inner);
      rest = (rest.slice(0,om.index)+rest.slice(om.index+om[0].length)).trim();
    }

    // 加值：(+30 愤恨, -20 临危不乱)。只摘除真的解析出加值的括号组，
    // 免得把「扫把（书灵）」这种当成加值给吃掉。
    const mods = [];
    const paren = /[（(]([^）)]*)[）)]/g;
    let pm, hit = null;
    while((pm = paren.exec(rest))){
      const got = [];
      pm[1].split(/[,，、;；]/).forEach(p=>{
        const g = p.trim().match(/^([+＋\-－−]\s*\d+)\s*(.*)$/);
        if(g) got.push({ v: parseInt(g[1].replace(/[＋]/g,"+").replace(/[－−]/g,"-").replace(/\s/g,""),10),
                         why: g[2].trim() });
      });
      if(got.length){ got.forEach(x=>mods.push(x)); hit = pm; break; }
    }
    if(hit) rest = (rest.slice(0,hit.index)+rest.slice(hit.index+hit[0].length)).trim();

    const label = rest.replace(/[:：]\s*$/,"").trim();
    if(!label) return;

    const c = { label, mods, opts, spec:null, diff, big };
    // [属性] 观察力 1D70+30 —— 骰式写在名称后面
    if(/^属性/.test(tag)){
      const tk = label.split(/\s+/), sp = tk.map(parseSpec).filter(Boolean);
      if(sp.length){
        c.kind="attr"; c.spec=sp[sp.length-1];
        c.label = tk.filter(x=>!parseSpec(x)).join(" ").trim() || "属性";
        out.push(c); return;
      }
    }
    const specFromTag = parseSpec(tag.replace(/^骰\s*/,""));
    if(/^骰/.test(tag) && specFromTag){ c.kind="roll"; c.spec=specFromTag; }
    else if(specFromTag && /^\d*[dD]\d+/.test(tag)){ c.kind = specFromTag.faces===100 ? "d100" : "roll"; c.spec=specFromTag; }
    else if(/极性/.test(tag)) c.kind="polar";
    else if(/光谱|谱/.test(tag)) c.kind="spectrum";
    else if(/表/.test(tag)) c.kind="table";
    else if(/分档|档/.test(tag)) c.kind="tier";
    else if(/检定/.test(tag)) c.kind="stat";
    else if(/好感/.test(tag)) c.kind="aff";
    else if(/暗骰|暗/.test(tag)) c.kind="hidden";
    else c.kind="d100";

    // 拿 [好感] 去量「对某事的XX程度」的，就地改判成量表
    if(c.kind==="aff" && affMisuse(c.label)){
      const p = scalePoles(c.label) || (poles && poles.length===2 ? poles : null);
      try{ console.warn("[安科] [好感] 用错了（应为「甲对乙」两个角色），改判为 "
        + (p?"[光谱]":"[D100]") + "：", c.label); }catch(e){}
      if(p){ c.kind="spectrum"; poles=p; c.label=c.label.replace(/[（(][^）)]*[）)]\s*$/,"").trim()||c.label; }
      else c.kind="d100";
    }
    if(c.kind==="spectrum"){ if(!poles) { if(opts.length>=2) poles=[opts[0],opts[1]]; else return; } c.poles=poles; }
    // 选项没解析出来就只能降级成普通判定，但要吭一声——
    // 之前正是这种静默降级把「选项里嵌书名号」的解析 bug 藏了很久
    if((c.kind==="polar" || c.kind==="table") && opts.length<2){
      try{ console.warn("[安科] 选项解析失败，降级为 D100：", tag, "|", rest, "| 解析出", opts); }catch(e){}
      c.kind = "d100";
    }
    if(c.kind==="tier"){
      c.tiers = opts.map(o=>{ const t=o.match(/^[>＞≥]\s*(\d+)\s*(.+)$/); return t?{at:+t[1],txt:t[2].trim()}:null; })
                    .filter(Boolean).sort((a,b)=>b.at-a.at);
      if(!c.tiers.length) c.kind="d100";
    }
    if(c.kind==="stat"){
      // label 形如「感知」；用人物卡里的属性值
      const key = Object.keys((game.sheet&&game.sheet.attrs)||{}).find(k=>c.label.indexOf(k)>=0);
      c.stat = key || null;
      c.statVal = key ? game.sheet.attrs[key] : 0;
      if(!c.diff) c.diff = 100;
    }
    // 《》里的东西只有「用选项的类型」才是选项。其它类型（判定/好感/检定…）
    // 那多半是书名或引用（「能否读懂《人间失格》」），得还回标签里去，不能吞掉。
    if(angleRaw && ["table","polar","spectrum","tier"].indexOf(c.kind) < 0){
      c.label = (c.label + "《" + angleRaw + "》").replace(/\s+/g," ").trim();
      c.opts = [];
    }
    if(!c.spec) c.spec = { n:1, faces: c.kind==="table" ? 10 : 100, bonus:0 };
    out.push(c);
  });
  return out.slice(0, limit || 6);
}

/* 摇一个判定。forcedRaw 用于作弊模式下直接指定骰面点数 */
function resolveCheck(c, forcedRaw){
  const sum = c.mods.reduce((a,b)=>a+b.v,0);
  const r = (forcedRaw!=null && isFinite(forcedRaw))
    ? { parts:[forcedRaw], raw:forcedRaw, total: forcedRaw + c.spec.bonus }
    : rollSpec(c.spec);
  c.parts = r.parts; c.raw = r.raw;
  c.total = r.total + sum + (c.kind==="stat" ? (c.statVal||0) : 0);
  const critRange = Math.max(1, Math.round(c.spec.faces*0.05));   // d100→5

  if(c.kind==="table"){
    c.total = c.raw;
    if(c.raw===c.spec.faces){ c.special=true; c.crit=true; c.outcome="？？？？（自由发挥）"; }
    else c.outcome = c.opts[tableIndex(c)] || "—";
    return c;
  }
  // 大成功/大失败只对「成不成功」有意义的判定生效。
  // 身高、人数、光谱位置这类骰出极值只是极值，不是「大成功」。
  if(["d100","hidden","stat","aff"].indexOf(c.kind) >= 0){
    if(c.raw >= c.spec.faces - critRange + 1) c.crit = true;
    if(c.raw <= critRange) c.fumble = true;
  }

  if(c.kind==="polar"){
    c.outcome = c.raw <= c.spec.faces/2 ? c.opts[0] : c.opts[1];
    return c;
  }
  if(c.kind==="spectrum"){
    c.pct = Math.max(0, Math.min(100, Math.round(c.total/c.spec.faces*100)));
    c.outcome = spectrumWord(c.pct, c.poles[0], c.poles[1]);
    return c;
  }
  if(c.kind==="tier"){
    const hit = c.tiers.find(t=>c.total>t.at);
    c.outcome = hit ? hit.txt : "未达到任何档位";
    return c;
  }
  if(c.kind==="stat"){
    c.outcome = c.total >= c.diff ? "成功" : "失败";
    if(c.crit) c.outcome = "大成功"; if(c.fumble) c.outcome = "大失败";
    return c;
  }
  if(c.kind==="aff"){
    if(c.crit) c.lv=3; else if(c.fumble) c.lv=-3;
    else c.lv = affMap(Math.max(16, Math.min(85, c.total)));
    c.outcome = (c.lv>0?"+":"") + c.lv;
    return c;
  }
  if(c.kind==="roll" || c.kind==="attr"){ c.outcome = String(c.total); return c; }
  // d100 / hidden：50 为分界线
  if(c.crit) c.outcome="大成功";
  else if(c.fumble) c.outcome="大失败";
  else c.outcome = c.total>=50 ? "成功" : "失败";
  return c;
}

function checkExpr(c){
  const sum = c.mods.reduce((a,b)=>a+b.v,0) + (c.kind==="stat" ? (c.statVal||0) : 0);
  const sp = c.spec;
  const head = sp.n+"D"+sp.faces + (sp.bonus ? (sp.bonus>0?"+":"")+sp.bonus : "")
             + (sum ? (sum>0?"+":"")+sum : "");
  const dice = sp.n>1 ? "("+c.parts.join("+")+")" : String(c.raw);
  const tail = (sp.bonus||sum) ? dice + (sp.bonus?(sp.bonus>0?"+":"")+sp.bonus:"") + (sum?(sum>0?"+":"")+sum:"") + " = " + c.total
                               : String(c.total);
  return "【ROLL：" + head + " = " + tail + "】";
}

/* ============================================================
   言论交锋
   ============================================================ */
function duelSide(s, leading){
  let n = s.dice + (s.lead && leading ? 1 : 0) + (s.immune ? 1 : 0);
  n = Math.max(1, Math.min(9, n));
  const ds = [];
  for(let i=0;i<n;i++){
    let v = roll(100);
    if(s.reward) v = Math.max(v, roll(100));
    ds.push(v + s.bonus);
  }
  return { ds, sum: ds.reduce((a,b)=>a+b,0) };
}
function simDuel(us, them){
  let adv = 0, r = 1; const log = [];
  while(Math.abs(adv) < 3 && r <= 12){
    const push = r<=3 ? 1 : 1 + Math.ceil((r-3)/3);
    const a = duelSide(us, adv>0), b = duelSide(them, adv<0);
    let w = "tie";
    if(a.sum > b.sum){ adv = Math.min(3, adv+push); w="us"; }
    else if(b.sum > a.sum){ adv = Math.max(-3, adv-push); w="them"; }
    log.push({ r, push, a, b, w, adv });
    r++;
  }
  return { log, winner: adv>=3 ? "us" : adv<=-3 ? "them" : "draw", adv };
}
/* 解析交锋声明 */
function parseDuel(txt){
  const m = txt.match(/[=＝]{2,}\s*交\s*锋\s*[=＝]{2,}([\s\S]*?)(?=[=＝]{2,}|$)/);
  if(!m) return null;
  const d = { topic:"", us:null, them:null };
  m[1].split("\n").forEach(line=>{
    const p = line.split(/[|｜]/).map(x=>x.trim());
    if(p.length<2) return;
    const k = p[0].replace(/[:：]/g,"").trim();
    if(/议题|主题/.test(k)){ d.topic = p[1]; return; }
    if(/我方|敌方|对方/.test(k)){
      const feats = (p[4]||"") + (p[5]||"");
      const side = { name:p[1]||"？", dice: Math.max(1,Math.min(6, parseInt(p[2],10)||3)),
        bonus: Math.max(-30, Math.min(40, parseInt(p[3],10)||0)),
        reward: /奖励骰/.test(feats), lead: /领先|穷追/.test(feats), immune: /免疫/.test(feats),
        featTxt: (p[4]||"").trim() };
      if(/我方/.test(k)) d.us = side; else d.them = side;
    }
  });
  return (d.us && d.them) ? d : null;
}
function duelHTML(d){
  if(!d || !d.res) return "";
  const pos = d.res.adv;
  let bar = '<div class="bar"><span class="nm">'+esc(d.us.name)+'</span>';
  for(let i=-3;i<=3;i++){
    if(i===0){ bar += '<span class="c" style="flex:0 0 2px;background:var(--line2)"></span>'; continue; }
    const on = (i>0 && pos>=i) || (i<0 && pos<=i);
    bar += '<span class="c '+(on ? (i>0?"us":"them") : "")+'"></span>';
  }
  bar += '<span class="nm">'+esc(d.them.name)+'</span></div>';

  const rows = d.res.log.map(x=>{
    const aw = x.w==="us", bw = x.w==="them";
    return '<div class="rd"><span class="n">第'+x.r+'回</span>'
      + '<span class="s'+(aw?" w":"")+'">'+esc(d.us.name)+' '+x.a.ds.join("+")+' = '+x.a.sum+'</span>'
      + '<span class="s'+(bw?" w":"")+'">'+esc(d.them.name)+' '+x.b.ds.join("+")+' = '+x.b.sum+'</span>'
      + '<span class="adv">优势 '+(x.adv>0?"+":"")+x.adv+'</span></div>';
  }).join("");

  const wn = d.res.winner==="us" ? d.us.name : d.res.winner==="them" ? d.them.name : null;
  return '<div class="duel"><div class="dh"><span class="k">言论交锋</span>'+esc(d.topic||"")+'</div>'
    + bar + rows
    + '<div class="win">'+(wn ? esc(wn)+" 取得了胜利" : "势均力敌，不分胜负")+'</div></div>';
}

function parseOpts(txt){
  const out = [];
  const fw = s => s.replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  txt.split("\n").forEach(raw=>{
    // 和判定行一样，容忍行首的 markdown 装饰、项目符号、「选项N」前缀
    let l = fw(raw.trim()).replace(/^[\s\-*>#•·—]+/,"").replace(/^\**/,"").replace(/^选项\s*/,"");
    const m = l.match(/^(\d{1,2})\s*[.、．)：:]\s*(.+)$/);
    if(!m) return;
    const i = +m[1];
    if(i>=1 && i<=10) out[i-1] = m[2].replace(/\*\*/g,"").replace(/\s*\*+\s*$/,"").trim();
  });
  return out;
}

function rollUser(t){
  const L = [];
  if(t.manual){
    L.push(`【安价】读者放弃掷骰，直接指定了走向：`, `「${t.manual}」`, ``, `请把它演绎出来，写第 ${t.no+1} 回。`);
  } else {
    L.push(`【ROLL：1D10=d10(10)=${t.rolled}】`);
    if(t.chaos){
      L.push(`骰出 ${t.rolled} → 「？？？？」，剧情交由你自由发挥。`);
      L.push(`追加判定【ROLL：1D2=d2(2)=${t.chaos.v}】→ **${t.chaos.label}**。`);
      L.push(t.chaos.v===1
        ? `请自由发挥一个**出人意料且对主角有利**的超展开：意外的援手、隐藏天赋觉醒、荒唐但奏效的巧合。要够离奇。`
        : `请自由发挥一个**出人意料且对主角不利**的超展开：灾难性误会、最坏时机的乱入、弄巧成拙的连锁反应。要够离奇，但别直接写死主角。`);
    } else {
      L.push(`选中第 ${t.rolled} 项：「${t.options[t.rolled-1]}」`, ``, `请把它演绎出来，写第 ${t.no+1} 回。`);
    }
  }
  L.push(``, `这是既成事实，必须照此发展。然后给出新的 10 个走向（第 10 项仍是「？？？？」）。`);
  return L.join("\n");

function checksToPrompt(checks, duel, incident){

    let s = `${i+1}. [${kind}] ${c.label} ${checkExpr(c)} → ${c.outcome}`;
    if(c.crit) s += "　★大成功";
    if(c.fumble) s += "　☠大失败";
    if(c.chain && c.chain.length){
      s += "\n　　骰出 "+c.spec.faces+" → ？？？？，换了一批更离谱的选项重摇：";
      c.chain.forEach(nc=>{
        s += "\n　　【升级"+nc.escLevel+"】" + checkExpr(nc) + " → "
           + (nc.special ? "又是 ？？？？，继续升级" : nc.outcome);
      });
      s += "\n　　**最终结果以最后一行为准**，前面那些没被选中的选项不要写进正文。";
    }
    else if(c.kind==="table" && c.special) s += "（骰出 "+c.spec.faces+"：请自由发挥一个比上面各项都更离奇的结果）";
    if(c.kind==="hidden") s += "（暗骰：不要在正文里明说，只让它影响角色的言行）";
    if(c.kind==="aff") s += `（好感度变化，写入 ===好感=== 段）`;
    L.push(s);
  });
  L.push("", "请在正文中用单独一行的 【判定N】 标出每次骰点发生的位置。");
  if(duel && duel.res){
    L.push("", "【言论交锋结果 —— 已由骰子决定】", `议题：${duel.topic}`);
    duel.res.log.forEach(x=>{
      L.push(`第${x.r}回合：${duel.us.name} ${x.a.sum} vs ${duel.them.name} ${x.b.sum} → `
        + (x.w==="us"?duel.us.name+"占上风":x.w==="them"?duel.them.name+"占上风":"平手")
        + `，当前优势 ${x.adv>0?"+":""}${x.adv}`);
    });
    const wn = duel.res.winner==="us" ? duel.us.name : duel.res.winner==="them" ? duel.them.name : null;
    L.push(wn ? `最终：${wn} 取得胜利。` : "最终：势均力敌，不分胜负。");
    L.push("请在正文中把这场交锋逐回合写出来：每一回合谁抛出了什么论点、对方如何招架。",
      "占上风的一方该说出更有力的话。可以用 [证物] 标记亮出的关键证据。",
      "在交锋开始的位置单独写一行 【交锋】，系统会把战况表渲染到那里。");
  }
  if(incident){
    L.push("", "【意外事件 —— 骰娘说这一回有事发生】",
      `是否有意外：【ROLL：1D100 = ${incident.gate}】→ 有（≥85 触发）`,
      `从读者的意外事件池（共 ${incident.size} 条）中抽中：`,
      `「${incident.pick}」`,
      "请把这个意外**自然地织进这一回**，不要生硬插入，也不要因为它而放弃已经骰出的其它结果。");
  }
  return L.join("\n");
}

const storyTurns = () => game.turns.filter(t=>!t.chargen);
const lastTurn = () => { const t = storyTurns(); return t[t.length-1]; };

/* ── 自动压缩前情（autocompaction）──────────────────────────────
   本来只有一档「完整保留最近 N 回」：更早的回合退成一行正文。可正文本身
   一个字都没少，上下文照样随回合数线性变长——第 40 回的每次调用都要把前
   39 回的正文重付一遍钱。

   现在压缩区攒够 COMPACT_CHARS 就整段交给模型写成一份「前情提要」，那些
   回合从此不再进 prompt，只留提要。提要是**增量**的：下一次拿上一份提要
   加新折叠的回合重写一份，所以 prompt 有上界，长篇不会越玩越贵。

   只影响发给模型的东西。页面上的正文、存档、导出都一个字不动。 */
const COMPACT_CHARS = 9000;   // 压缩区超过这么多字就折叠，约 10～14 回
const DIGEST_CHARS  = 1400;   // 提要写多长
const MEM_BLOCK     = 4;      // 压缩边界对齐的步长，见下

/* 历史切成三段：[0,folded) 已折进提要、[folded,boundary) 只留正文、[boundary,) 完整原文 */
function memSplit(){
  const ts = storyTurns();
  const keep = Math.max(1, cfg.mem|0);
  const folded = Math.max(0, Math.min(game.digest ? game.digest.upto|0 : 0, ts.length));
  /* 压缩边界对齐到 MEM_BLOCK 的倍数。
     以前是纯滑动窗口，每回合都有一个回合从「完整原文」翻成「压缩正文」，
     等于每回合都改写历史中段，前缀缓存必然失效。对齐之后边界每 4 回才动一次。
     取 max 是因为撤回重写会让边界倒退，不能退到已经折进提要的回合里去。 */
  const aligned = Math.floor(Math.max(0, ts.length - keep) / MEM_BLOCK) * MEM_BLOCK;
  return { ts, folded, boundary: Math.max(folded, aligned) };
}

function buildMsgs(extra){
  const m = [{role:"system", content: writeSys()}, {role:"user", content: openUser()}];
  const { ts, folded, boundary } = memSplit();
  if(folded){
    // 提要每压缩一次才变一次，是很稳的前缀，值得单独占一个缓存断点
    m.push({ role:"assistant", content: "===前情提要（第 1～"+folded+" 回，系统压缩）===\n"+game.digest.text });
    m[m.length-1]._cache = true;
  }
  ts.forEach((t,i)=>{
    if(i < folded) return;                 // 已经在提要里了，别再塞一遍
    const full = i >= boundary;
    m.push({ role:"assistant", content: full ? t.raw : "===正文===\n"+t.narration });
    if(t.rolled || t.manual) m.push({ role:"user", content: rollUser(t) });
    // 压缩区的最后一条打缓存断点：这一段每 4 回才变一次，正好可缓存
    if(i === boundary-1) m[m.length-1]._cache = true;
  });
  if(extra) m.push({ role:"user", content: extra });
  return m;
}

function digestPrompt(ts, folded, boundary, prev){
  const L = [];
  L.push("下面是一篇正在连载的互动小说《"+(cfg.title||"未命名安科")+"》的前半部分。",
         "把它压缩成一份**前情提要**，交给主持人接着往下写。", "");
  if(prev) L.push("【现有提要（第 1～"+folded+" 回）】", prev, "");
  L.push("【要并进来的新内容（第 "+(folded+1)+"～"+boundary+" 回）】");
  for(let i=folded;i<boundary;i++) L.push("〔第 "+ts[i].no+" 回〕" + String(ts[i].narration||"").trim());
  L.push("", "要求：",
    "· 输出一份覆盖第 1～"+boundary+" 回的**完整**提要，不是只写新增那几回——现有提要里该留的信息要留下来。",
    "· "+DIGEST_CHARS+" 字以内。按时间顺序写成连贯的叙述，不要分点罗列。",
    "· 必须保住：出场人物和他们之间的关系、主角此刻的处境和手上的东西、已经发生的关键转折、还没揭晓的伏笔与悬念。",
    "· 人名、地名、专有名词一律照抄原文，不要改写，也不要新编。",
    "· 只写已经发生的事。不要预测后续，不要评论，不要加标题，不要写导游吐槽。");
  return L.join("\n");
}

/* 该压缩就压缩，不该就立刻返回 false（每回合都会问一次，一般十来回才真跑一次）。
   压缩本身也是一次调用，也要计费，所以别在没必要的时候跑。 */
let compacting = false;
async function autocompact(signal, onStart){
  if(cfg.autocompact === false || compacting) return false;
  const { ts, folded, boundary } = memSplit();
  if(boundary <= folded) return false;
  let chars = 0;
  for(let i=folded;i<boundary;i++) chars += String(ts[i].narration||"").length;
  if(chars < COMPACT_CHARS) return false;

  compacting = true;
  try{
    if(onStart) onStart();
    const prev = game.digest ? game.digest.text : "";
    // 单条 user 消息、不带 system：这段输入折叠完就不会再出现，缓存它没意义
    const r = await streamChat([{ role:"user", content: digestPrompt(ts, folded, boundary, prev) }],
                               ()=>{}, signal);
    bill(r.usage);
    const text = r.text.replace(/^[#*\s]*前情提要[（(][^）)]*[）)]?\s*[:：]?/,"")
                       .replace(/^[#*\s]*前情提要\s*[:：]?/,"").trim();
    // 宁可这次不压，也不能把一句废话当成前 20 回的记忆塞进去
    if(text.length < 60) throw new Error("提要太短（"+text.length+" 字），这次不压");
    game.digest = { upto: boundary, text, from: folded, chars };
    saveGame();
    toast("已把前 "+boundary+" 回压成前情提要");
    return true;
  } finally { compacting = false; }
}

/* ============================================================
   解析正文
   ============================================================ */
const MK = {
  sc: /(?:^|\n)\s*[#*\s]*[=＝]{2,}\s*场\s*景\s*[=＝]{2,}[#*\s]*/,
  n:  /(?:^|\n)\s*[#*\s]*[=＝]{2,}\s*正\s*文\s*[=＝]{2,}[#*\s]*/,
  st: /(?:^|\n)\s*[#*\s]*[=＝]{2,}\s*状\s*态\s*[=＝]{2,}[#*\s]*/,
  cl: /(?:^|\n)\s*[#*\s]*[=＝]{2,}\s*线\s*索\s*[=＝]{2,}[#*\s]*/,
  af: /(?:^|\n)\s*[#*\s]*[=＝]{2,}\s*好\s*感\s*[=＝]{2,}[#*\s]*/,
  op: /(?:^|\n)\s*[#*\s]*[=＝]{2,}\s*选\s*项\s*[=＝]{2,}[#*\s]*/
};
function seg(txt, key, order){
  const m = txt.match(MK[key]); if(!m) return "";
  const start = m.index + m[0].length;
  let end = txt.length;
  order.forEach(k=>{ if(k===key) return;
    const mm = txt.match(MK[k]); if(mm && mm.index >= start && mm.index < end) end = mm.index; });
  return txt.slice(start, end);
}
function parseTurn(txt){
  const ord = ["sc","n","st","cl","af","op"];
  let narration = seg(txt,"n",ord);
  let optBlock  = seg(txt,"op",ord);
  if(!narration){
    const li = txt.search(/(?:^|\n)\s*1\s*[.、．)]\s*\S/);
    narration = li>=0 ? txt.slice(0,li) : txt;
    if(!optBlock && li>=0) optBlock = txt.slice(li);
  }
  const scene = seg(txt,"sc",ord).split("\n").map(x=>x.trim())
    .filter(x=>x && !/[=＝]{2,}/.test(x)).slice(0,2);
  const stats = seg(txt,"st",ord).split("\n").map(l=>l.trim())
    .filter(l=>l && /[:：]/.test(l) && !/[=＝]{2,}/.test(l))
    .map(l=>{ const i=l.search(/[:：]/);
      return { k:l.slice(0,i).replace(/^[-*·\s]+/,"").trim(), v:l.slice(i+1).trim() }; })
    .filter(x=>x.k&&x.v).slice(0,8);
  const clues = seg(txt,"cl",ord).split("\n").map(l=>l.trim().replace(/^[-*·\d.、）)\s]+/,""))
    .filter(l=>l && l.length>3 && !/[=＝]{2,}/.test(l)).slice(0,4);
  const affs = seg(txt,"af",ord).split("\n").map(l=>l.trim())
    .map(l=>{ const m=l.match(/^(.+?)\s*(?:[→>对]|->)\s*(.+?)\s*([+＋\-－−]\s*\d+)/);
      return m ? { a:m[1].trim(), b:m[2].trim(),
        v: parseInt(m[3].replace(/[＋]/g,"+").replace(/[－−]/g,"-").replace(/\s/g,""),10) } : null; })
    .filter(Boolean).slice(0,8);

  const opts = [];
  optBlock.split("\n").forEach(l=>{
    const m = l.trim().match(/^[-*>\s]*(\d{1,2})\s*[.、．)：:]\s*(.+)$/);
    if(!m) return;
    const i = +m[1];
    if(i>=1&&i<=10) opts[i-1] = m[2].replace(/\*\*/g,"").trim();
  });
  return { scene, narration: narration.replace(/[=＝]{2,}.*$/gm,"").trim(), stats, clues, affs, options: opts };
}

/* 正文 → HTML，插入判定块 / 吐槽 / 交锋 */
/* 把正文扫成一个个独立的块。流式阶段靠它做增量渲染：
   只有变化的那一块会动，已经画好的段落和判定块原地不动，所以不会闪。 */
function narrScan(t, editable){
  const used = new Set();
  const blocks = [];
  let duelDone = false;
  t.narration.split("\n").forEach(raw=>{
    const l = raw.trim();
    if(!l) return;
    // 以前这里是整行锚定的，模型把两个标记写在同一行（【判定4】【判定5】）
    // 就一个都匹配不上，整行当普通文字渲染出去了。改成扫出行内所有标记。
    const MARK = /[【\[]\s*判定\s*(\d{1,2})\s*[】\]]/g;
    if(MARK.test(l)){
      MARK.lastIndex = 0;
      let mm;
      while((mm = MARK.exec(l))){
        const i = +mm[1]-1;
        if(t.checks && t.checks[i] && !used.has(i)){ used.add(i); blocks.push(checkHTML(t.checks[i],i,editable)); }
      }
      const rest = l.replace(/[【\[]\s*判定\s*\d{1,2}\s*[】\]]/g,"").trim();
      if(rest) blocks.push("<p>"+rich(rest)+"</p>");
      return;
    }
    // 注意：这个标志必须是局部的。以前写在 t 上，会被 saveGame 持久化，
    // 一旦变成 stale-true，下面的兜底就永远不触发，交锋战况表会凭空消失。
    if(/^[【\[]?\s*交\s*锋\s*[】\]]?\s*[:：]?$/.test(l)){
      if(t.duel && !duelDone){ blocks.push(duelHTML(t.duel)); duelDone = true; }
      return;
    }
    if(/^\/\//.test(l)){ blocks.push('<div class="aside">'+esc(l.replace(/^\/\/\s*/,"// "))+'</div>'); return; }
    blocks.push("<p>"+rich(l)+"</p>");
  });
  return { blocks, used, duelDone };
}

function narrHTML(t, live, editable){
  const s = narrScan(t, editable);
  const out = s.blocks.slice();
  // 没被放置的判定统一补到最前
  if(t.checks){
    const left = t.checks.map((c,i)=>s.used.has(i)?null:checkHTML(c,i,editable)).filter(Boolean);
    if(left.length) out.unshift(left.join(""));
  }
  if(t.duel && !s.duelDone) out.push(duelHTML(t.duel));
  if(live) out.push('<span class="cursor"></span>');
  return out.join("");
}

/* ============================================================
   OpenRouter
   ============================================================ */
/* OpenRouter 上（含 Gemini、DeepSeek）prompt 缓存需要显式打 cache_control 断点，
   不打就是 cached_tokens=0、全价重算。实测 gemini-3.6-flash 打了断点后
   同一段 6.4k 前缀的成本从 $0.009714 降到 $0.001064。
   断点最多 4 个，这里用 2 个：系统提示词末尾 + 稳定历史末尾。 */
const cacheBlock = text => [{ type:"text", text:String(text), cache_control:{ type:"ephemeral" } }];

async function streamChat(msgs, onText, signal, sys){
  // 唯一的出口闸门：入口处也拦（见 nextTurn / dockRoll），这里是兜底
  if(overCap()) throw budgetErr();
  const out = msgs.map(m => (m && m._cache)
    ? { role:m.role, content: cacheBlock(m.content) }
    : { role:m.role, content:m.content });
  if(sys) out[0] = { role:"system", content: cacheBlock(sys) };
  else if(out[0] && out[0].role==="system") out[0] = { role:"system", content: cacheBlock(msgs[0].content) };

  const proxied = viaProxy();
  const body = { model: proxied ? PROXY_MODEL : cfg.model.trim(), messages: out,
                 temperature: +cfg.temp, stream: true, usage: { include: true } };
  /* Gemini Flash 这类模型默认会先「思考」一大段，而思考 token 是要计费且你看不到的。
     实测同一段 300 字正文：默认思考占 66% 输出、$0.00602；
     effort=minimal 思考归零、正文一样长、$0.00196 —— 便宜三分之二。
     关掉省钱模式就不发这个字段，交回模型自己的默认行为。 */
  if(cfg.thrift !== false) body.reasoning = { effort: "minimal" };
  // 这一局是哪篇安科——落进 OpenRouter 的 activity（Client User ID 列）和 generation 记录
  body.session_id = sessionId();
  body.user       = userTag();
  // 代理模式不带任何凭据
  const res = await fetch(proxied ? PROXY_URL : API+"/chat/completions", { method:"POST", signal,
    headers: proxied
      ? { "Content-Type":"application/json" }
      : { "Content-Type":"application/json", "Authorization":"Bearer "+cfg.key.trim(),
          "X-Title":"Anko Player", "HTTP-Referer":APP_URL },
    body: JSON.stringify(body) });
  if(!res.ok){
    let d = await res.text();
    try{ const j=JSON.parse(d); d = j.error?.message || j.message || d; }catch(e){}
    if(/guardrail/i.test(String(d)) && viaProxy())
      throw new Error("内置额度只开放了 "+PROXY_MODEL+" 这一个模型。\n\n"
        + "想用别的模型，请在设置里填你自己的 OpenRouter key（直连、费用走你自己的账号）。");
    throw new Error("HTTP "+res.status+" — "+String(d).slice(0,500));
  }
  const rd = res.body.getReader(), dec = new TextDecoder();
  let buf="", text="", usage=null;
  for(;;){
    const {done,value} = await rd.read(); if(done) break;
    buf += dec.decode(value,{stream:true});
    const lines = buf.split("\n"); buf = lines.pop();
    for(const raw of lines){
      const s = raw.trim();
      if(!s || s.startsWith(":") || !s.startsWith("data:")) continue;
      const d = s.slice(5).trim(); if(d==="[DONE]") continue;
      let j; try{ j = JSON.parse(d); }catch(e){ continue; }
      if(j.error) throw new Error(j.error.message || JSON.stringify(j.error));
      const c = j.choices && j.choices[0];
      if(c && c.delta && c.delta.content){ text += c.delta.content; onText(text); }
      if(j.usage) usage = j.usage;
    }
  }
  if(!text.trim()) throw new Error("模型没有返回任何内容（可能拒绝了请求，或上游超时）。换个模型试试。");
  return { text, usage };
}
function bill(usage){
  if(!usage) return;
  /* BYOK 的请求 usage.cost 是 0（OpenRouter 不收推理费），真正的钱在
     cost_details.upstream_inference_cost 里；非 BYOK 反过来，upstream 那项没有。
     实测一次 BYOK 调用：cost:0 + upstream_inference_cost:0.0014955。
     原来写的是 cost || upstream，两边都非 0 的时候（BYOK 手续费）会把上游那
     一大笔整个漏掉——上限就成了摆设，所以相加。 */
  const cd = usage.cost_details || {};
  game.cost += (+usage.cost || 0) + (+cd.upstream_inference_cost || 0);
  game.tok  = (game.tok||0) + (+usage.total_tokens || 0);
}

function hud(){
  $("#g-title").textContent = cfg.title || "未命名安科";
  $("#g-turn").textContent  = "第 " + storyTurns().length + " 回";
  $("#g-model").textContent = cfg.model.split("/").pop();
  const ct = $("#g-cost");
  ct.textContent = "$" + game.cost.toFixed(4) + " / $" + COST_CAP.toFixed(2)
    + (game.tok ? " · " + (game.tok>=1000 ? (game.tok/1000).toFixed(1)+"k" : game.tok) + " tok" : "");
  // 到七成先变黄、到顶变红——别等按下去才发现这局已经停了
  const ratio = (game.cost||0) / COST_CAP;
  ct.classList.toggle("warn", ratio >= .75 && ratio < 1);
  ct.classList.toggle("over", ratio >= 1);
  ct.title = "这一局的累计花销。上限 $" + COST_CAP.toFixed(2)
    + "，到顶就不再发任何请求；新开一局重新计数。"
    + (game.digest ? "\n前 " + game.digest.upto + " 回已压成前情提要。" : "");
}
function sheetHTML(s){
  if(!s) return "";
  let h = '<div class="card"><div class="ch">人物卡</div>';
  const a = Object.entries(s.attrs);
  if(a.length){
    const lo = a.slice().sort((x,y)=>x[1]-y[1])[0], hi = a.slice().sort((x,y)=>y[1]-x[1])[0];
    const span = Math.max(1, hi[1]);
    h += '<div class="attrs">' + a.map(([k,v])=>{
      const cls = k===lo[0] ? " lo" : k===hi[0] ? " hi" : "";
      return '<span class="at'+cls+'"><i>'+esc(k)+'</i><b>'+v+'</b>'
           + '<em style="width:'+Math.max(3,Math.min(100, v/span*100))+'%"></em></span>';
    }).join("") + '</div>';
  }
  if(s.traits.length)
    h += '<div class="stat">'+s.traits.map(t=>'<span class="s"><i>'+esc(t.label)+'</i><b>'+esc(t.outcome)+'</b></span>').join("")+'</div>';
  if(s.world.length)
    h += '<div class="ch" style="margin-top:14px">世界设定</div><div class="stat">'
       + s.world.map(w=>'<span class="s"><i>'+esc(w.label)+'</i><b>'+esc(w.outcome)+'</b></span>').join("")+'</div>';
  return h + '</div>';
}
function turnHTML(t, live){
  if(t.chargen){
    return '<div class="turn"><div class="tno"><span class="n">开 局 骰</span></div>'
      + '<div class="narr">'+(t.checks||[]).map((c,i)=>checkHTML(c,i)).join("")+'</div>'
      + sheetHTML(game.sheet) + '</div>';
  }
  const editable = cfg.cheat && !live && lastTurn()===t;
  let h = '<div class="turn"><div class="tno"><span class="n">第 '+t.no+' 回</span></div>';
  if(t.scene && t.scene.length)
    h += '<div class="scene">'+t.scene.map(x=>"<div>"+esc(x)+"</div>").join("")+'</div>';
  h += '<div class="narr">'+narrHTML(t,live,editable)+'</div>';
  if(cfg.status && t.stats && t.stats.length)
    h += '<div class="stat">'+t.stats.map(s=>'<span class="s"><i>'+esc(s.k)+'</i><b>'+esc(s.v)+'</b></span>').join("")+'</div>';
  if(t.affs && t.affs.length)
    h += '<div class="affrow">'+t.affs.map(a=>'<span class="a"><u>'+esc(a.a)+' → '+esc(a.b)+'</u> '
      +(a.v>0?"+":"")+a.v+'</span>').join("")+'</div>';
  if(t.clues && t.clues.length)
    h += t.clues.map(c=>'<div class="clue"><span class="h">[ 线索已收集 ]</span>'+esc(c)+'</div>').join("");

  const opts = t.options || [];
  if(opts.length){
    const done = t.rolled || t.manual;
    h += '<div class="opts"><div class="hd">10 个走向</div>';
    for(let i=0;i<10;i++){
      const txt = opts[i]; if(!txt) continue;
      const q = isQ(txt), win = t.rolled===i+1;
      const can = !done && (cfg.anka || cfg.cheat) && (!q || cfg.cheat);
      const cls = ["opt", q?"q":"", win?"win":"", (done&&!win)?"dim":"", can?"pick":""].filter(Boolean).join(" ");
      h += '<button class="'+cls+'" '+(can?'data-pick="'+(i+1)+'"':"")+'><span class="i">'+(i+1)
         + '</span><span class="t">'+esc(txt)+'</span></button>';
    }
    h += '</div>';
  }
  if(t.rolled){
    h += '<div class="rollline'+(t.forced?" manual":"")+'">'
       + (t.forced ? '<span class="lbl">【作弊·指定】</span><span class="v">'+t.rolled+'</span>'
                   : '<span class="lbl">【ROLL：1D10=d10(10)=</span><span class="v">'+t.rolled+'</span><span class="lbl">】</span>');
    h += t.chaos
      ? '<span>→ ？？？？</span></div><div class="rollline chaos"><span class="lbl">【ROLL：1D2=d2(2)=</span><span class="v">'
        + t.chaos.v+'</span><span class="lbl">】</span><span>→ '+t.chaos.label+'</span></div>'
      : '<span>→ '+esc(t.options[t.rolled-1]||"")+'</span></div>';
  } else if(t.manual){
    h += '<div class="rollline manual"><span class="lbl">【安价】</span><span>'+esc(t.manual)+'</span></div>';
  }
  // 作弊工具条：只挂在最新一回，事后想重来才用，不打断正常流程
  if(cfg.cheat && !live && lastTurn()===t){
    h += '<div class="cheatbar">'
      + '<span class="lb">作弊</span>'
      + '<span class="lb2">改上面任意判定的点数（↻ 重掷 / 填数字后按 ✓），然后：</span>'
      + '<button class="btn sm" data-redo="write">⟳ 用这些点数重写本回合</button>'
      + '<button class="btn sm" data-redo="recheck">↻ 全部重掷并重写</button>'
      + '</div>';
  }
  return h + '</div>';
}

  res.innerHTML = o.title ? '<div class="lbl2">'+esc(o.title)+'</div>' : "";
